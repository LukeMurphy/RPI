[displayconfig]

work = moving_points_2
# work = diagnostics

rendering = hub
rotation = -90
fullRotation = True
rotationTrailing = False
checkForConfigChanges = True
doFullReloadOnChange = True
isRPI = False


tileSizeHeight = 32
tileSizeWidth = 32
matrixTiles = 8
rows = 12
cols = 12

## Also determines the window geometry
screenWidth = 256
screenHeight = 256

windowWidth = 256
windowHeight = 256

# preparing for rotation
# if 90 degree rotated, make height same as screen width
canvasWidth = 256
canvasHeight = 256

# for small adjustments when sending to matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset

windowXOffset = 2583
# windowYOffset = 60
#windowYOffset = 147 + 320
windowYOffset = 118

brightness =  1.0
minBrightness = 0

imageXOffset = 0
imageYOffset = 0


remapImageBlock = False
remapImageBlockSection = 0,0,256,256
remapImageBlockDestination = 0,0
remapImageBlockSectionRotation = 0

remapImageBlock2 = False
remapImageBlockSection2 = 0,160, 80,200
remapImageBlockDestination2 = 320,200
remapImageBlockSection2Rotation = 0

remapImageBlock3 = False
remapImageBlockSection3 = 0,0, 384,384
remapImageBlockDestination3 = 0,-320
remapImageBlockSection3Rotation = -90

remapImageBlock4 = False
remapImageBlockSection4 = 0,160, 320,192
remapImageBlockDestination4 = 0,32
remapImageBlockSection4Rotation = 0

useFilters = True
ditherFilterBrightness = 1.0

useBlur = False
blurXOffset = 0
blurYOffset = 0
blurSectionWidth = 256
blurSectionHeight = 256
sectionBlurRadius = 1

useLastOverlay = False
useLastOverlayProb = .001
useVariablePixelSort = True

usePixelSort = False
pixelSortRotatesWithImage = True
pixSortDirection = lateral
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 48
pixSortboxHeight = 2
pixSortboxWidth = 256
pixSortgap = 1
pixSortprobDraw = .951
pixSortprobGetNextColor = 1
pixSortProbDecriment = 1
pixSortSizeDecriment = 0
pixSortSampleVariance = 4
pixSortDrawVariance = 1
randomColorProbabilty = .005
brightnessVarLow = .2
brightnessVarHi = 1.1
pixelSortAppearanceProb = 1

forceBGSwap = False


[Points]
#-------------------------------------------#

refreshRate = .02
animationRate = .03

numberOfPoints = 433

barThicknessMin = 0
barThicknessMax = 1

barLengthMin = 5
barLengthMax = 6

xSpeedRangeMin = 1
xSpeedRangeMax = 10

ySpeedRangeMin = 0
ySpeedRangeMax = 0

speedRange = 5

xRange = 0,0
yRange = 0,256

# y mid point
midStreamPoint = 128

# x point after which element do righ-turn
splitPoint = 128


chanceParticleComesFromOppositeSide = .95
# the arc factor for the turn smaller means bend is sharper
# although it affects the angular speed - so faster objects
# turn in wider radius
radialFactor = 4


# linear
movementModel = linear


# 45 degrees is a full triangle tip
# like a filbert
# 0 is a flat
# 10 - 15 is like a chisel tip
# no rounds ?
tipType = 1
tipAngle = 0
tiptypealt = 0


# hue min.max  saturation min,max  value min.max dropHueMin dropHueMax
# reds of fall
cset1 = 350,30,.85,1,.1,.98,0,0

# yellow greens of spring
cset2 = 50,180,.5,1,.1,.8,0,0

# winter water
cset3 = 180,270,.5,1,.1,.8,0,0

# psychadelic summer dream
cset4 = 270,350,.5,1,.1,.8,0,0

# mum's colors
cset5 = 0,46,.5,.99,.5,.999,0,0

cset6 = 340,10,.5,.99,.3,.999,0,0


#colorSets = cset5,cset6,cset9,cset5,cset6
colorSets = cset1,cset2,cset3,cset5,cset5,cset6,cset6


fillColor = 46,46,.5,.99,.01,.03,0,0
fillColorAlpha = 10

# border colors
edgeAlphaMin = 128
edgeAlphaMax = 255

fillAlphaMin = 200
fillAlphaMax = 255

blurRemapRangeX = 128
blurRemapRangeY = 128
blurRemapminHoriSize = 128
blurRemapminVertSize = 128
blurRadius = 1

filterRemapRangeX = -10
filterRemapRangeY = -10
filterRemapminMinHoriSize = 384
filterRemapminMinVertSize = 384
filterRemapminHoriSize = 384
filterRemapminVertSize = 384
filterRemappingProb = .0

colorChangeProb = .003
changeShapeProb = 0.0
changeMovementProb = 0.00

distanceReductionFactor = 30
distanceFadeOffFactor = 100

