[displayconfig]
#----------------------------------------------------#
work = hashing-v2
# work = diagnostics
#----------------------------------------------------#

rotation = 0
checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 64
tileSizeWidth = 64

rows = 5
cols = 6

# ---  Also determines the window geometry
screenWidth = 384
screenHeight = 320

# ---  preparing for rotation
windowWidth = 384
windowHeight = 320

canvasWidth = 384
canvasHeight = 320

imageXOffset = 0
imageYOffset = 0

# - for small adjustments when sending to 
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2910
windowYOffset = 253


brightness =  1.0
minBrightness = 0

usePixelSort = False
pixelSortRotatesWithImage = True
pixSortDirection = lateral
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = -2
pixSortboxHeight = 2
pixSortboxWidth = 384
pixSortgap = 0
pixSortprobDraw = .025
pixSortprobGetNextColor = .9
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 2
pixSortDrawVariance = 1
randomColorProbabilty = .1
brightnessVarLow = .99
brightnessVarHi = 1.0
pixelSortAppearanceProb = .99


## This is re-used by the dither filter
## to set the patch affected
remapImageBlock = False		
remapImageBlockSection = 0,0,256,384
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0

remapImageBlock3 = False
remapImageBlockSection3 = 64,225,128,256
remapImageBlockDestination3 = 384,128
remapImageBlockSection3Rotation = 0

remapImageBlock4 = False
remapImageBlockSection4 = 0,0,192,384
remapImageBlockDestination4 = 0,0
remapImageBlockSection4Rotation = .18


useBlur = False
blurXOffset = 0
blurYOffset = 0
blurSectionWidth = 448
blurSectionHeight = 192
sectionBlurRadius = 1

useFilters = False

# ################################################### #
# hatching hashing lines

[hatchingmarks]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 384
drawingHeight = 320


noiseAmplitude = 2
noiseAmplitudeRange = 1.1,4.0
lineSpeedRange = 1,3
baseWidthRange = 0,0
drawingHeightRange = 200,500
ratioFactorRange = 1,1
distributionRange = 4
numberOfinformalLines = 7

# more loops and tangles
tangleProb = 1.0
backTrackRange = 1,10

# grid single-lines
drawingShape = grid
renderLinesAsEnvelope = True

# these really control the feel of
# activity - frenetic grid, soft undulations
# sense of randomness on or through the grid
# @todo make into mode sets

xOffset = 8
pointsPerLineCol = 28
colAdj = 1
colFirst = True
noiseAmplitudeRangeCol = 1.1,4.0
colIntervalRange = 20,80
verticalMovement = True
verticalMovementProb = .002
vertLineChangeRange = .001,.02
vertLineSpeedRange = 1,3
vertBaseWidthRange = 0,0

yOffset = 8
pointsPerLineRow = 28
rowAdj = 1
rowIntervalRange = 20,80
horizontalMovement = True
noiseAmplitudeRangeRow = 1.1,4.0
horizontalMovementProb = 0.0020
horizLineChangeRange = .001,.002
horizLineSpeedRange = 1,3
horizBaseWidthRange = 0,0

uniformRatio = False
squareRatio = False

useSingleMode = False
# these only need to be set for singleMode
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 10
# line_alpha = 180

# chance per frame the overall drawing character changes
changeLinesProb = .0004
changeBGProb = 0.0001

lightMode = True
lightModeProb = 1.1

pauseProb = .0002
unpauseProb = .003

bg_alpha_range = 20,140
line_alpha_range = 18,30

# when going full black/white return to base at this per cycle
bg_alpha_returnrate = .2

# smoothness + speed - higher is smoother
frames = 8
scrollRate = 0

line_minHue = 0
line_maxHue = 60
line_minSaturation = .5
line_maxSaturation = .50
line_minValue = .05
line_maxValue = .10
line_minDropHue = 0
line_maxDropHue = 0

bg_minHue = 355
bg_maxHue = 60
bg_minSaturation = 0.2
bg_maxSaturation = 0.5
bg_minValue = .6
bg_maxValue = .6
bg_dropHueMin = 11
bg_dropHueMax = 50

# blanks blocks
resetBlanksProb = .0005
numberOfDeadPixels = 2
blankColorAsColorProb = .0
sizeTarget = 384,320
colsRange = 32,128
rowsRange = 32,128



#--------------------- filterRemapping  ------------------

filterRemapping = False
filterRemappingProb = .002
filterRemapMinHoriSize = 12
filterRemapMaxHoriSize = 256
filterRemapMinVertSize = 3
filterRemapMaxVertSize = 16
filterRemapRangeX = 384
filterRemapRangeY = 320

contractXSpeed = 10
contractYSpeed = 10
expandXSpeed = 10
expandYSpeed = 10



[diag]
#---------------------------------#

fontColor = 255,255,0
outlineColor = 255,0,0
fontColor2 = 0,0,100
bgColor = 0,0,254
showGrid = True
fontSize = 14

brightness =  .2
outerColor = 10,0,100
innerColor = 230,40,0
borderColor = 10,0,0

