#-----------------------------------------------#
fontColor = 0,240,90
outlineColor = 100,0,100
fontColor2 = 90,100,0
bgColor = 0,0,50
showGrid = True
fontSize = 11

brightness = .8
outerColor = 0,0,100
innerColor = 30,40,0
borderColor = 0,0,0