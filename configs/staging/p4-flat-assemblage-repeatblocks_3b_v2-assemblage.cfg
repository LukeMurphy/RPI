# palettes = golden

#--------------------- PATTERNS  ---------------------
# the types of pattern
# wavePattern
# reMove -->lines move
# diagonalMove  --> block moves
# randomizer
# runningSpiral
# concentricBoxes
# runningSpiral
# diamond
# shingles
# circles
# waveScales
# fishScales
# wavePattern2
# compass
# circlesPacked
# coloredBlocks


# patterns = decoBoxes,reMove,shingles,concentricBoxes,diamond,balls,concentricBoxes,randomizer,fishScales
# patterns = compass,shellScales,waveScales,fishScales,randomizer,wavePattern2
# patterns = waveScales,balls
# patterns = coloredBlocks,coloredBlocks
# patterns = coloredBlocks,coloredBlocks,compass,shellScales,waveScales,fishScales,randomizer,wavePattern2
patterns = fishScales,fishScales,waveScales

# initial patternModel -- this is NOT used if the patterns list is specified!
patternModel = fishScales
patternSequence = fishScales,0,0

# dimensions of each pattern block
blockWidth = 48
blockHeight = 48

# number of rows & cols drawn
cols = 6
rows = 4

# the higher the pattern sequence limits,
# means more changes in the patterns shown
patternSequenceMin = 3
patternSequenceMax = 4

# lower = more variation in patterns
positionRange = 10
patternIterateCount = 20

# PATTERN CHANGE 
# rate the patterns change - if lower, then the distortions
# are more complete - checked each cycle so
# .001 roughly is a 3% chance every second, so over 33s there 
# is a 99% chance that the patterns will change - actually that
# math is probably wrong and I should find out the right formula
# but let's say that it's at least a 99% chance but probably more
rebuildPatternProbability = 0.001
patternModelVariations = True
drawbgcolorEachCycle = True
changePaletteWhenRebuildProb = .5

# chance that the palette will draw a new color
# from the active palette when the pattern changes
# lower means more uniform palette
changePaletteWhenChangingPatternProb = .2

# chance that when the palette changes, it pulls
# a whole new palette from the available list
# lower means more uniform palette
changeFullPaletteWhenChangingPatternProb = .1


#--- individual pattern parameters  ---------------------
# increases density of pattern for diamonds, balls, shingles
numRows = 4
numDotRows = 3
numRowsRandomize = False
numShingleRows = 2

shingleVariation = True
shingleVariationRange = 6

# to be nice and even, has to be even multiple of blockWidth
# if you want artifact, then anything else ;)
lineDiff = 2
useDoubleLine = True

# decobox controls
decoboxbandwidth = 3

#waveScales controls
linesOnly = False
numScaleRows = 4
ringsRange = 10,18
stepsRange = 2,3

# for the diamond pattern
diamondStep = 1
randomizeSpeed = True

# for any moving pattern: diamond, reMove
xSpeed = .8
ySpeed = .25

# for the concentric squares
numConcentricBoxes = 24

# for the randomizer
randomBlockProb = .1
randomBlockWidth = 0
randomBlockHeight = 0

# skip the rendering of any block
#skipBlocks = 2, 3, 5, 7, 11, 13,
# skipBlocks = 254,255,257,258
skipBlocks = 500

# For the sine wave repeater
steps = 2
amplitude = 9
yOffset = 12

steps2 = 2
amplitude2 = 9
yOffset2 = 13
phaseFactor = 4
speedFactor = 1

