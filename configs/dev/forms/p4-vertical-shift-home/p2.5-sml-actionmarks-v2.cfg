penNames = lineMarksHoriz,longOvalSweeps1,longOvalSweeps2,longOvalSweeps2b,spiralGyres,spiralGyres2,lineMarks2,shortMarks,shortMarks2,scratchyLong,scratchyLong2,lineMarksH1,lineMarks2,lineMarksVert,lineMarksVertHeavy,lineMarksVertHeavyLight,lineMarksVertHeavyLightColor


