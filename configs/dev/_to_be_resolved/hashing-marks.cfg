[displayconfig]

work = hashing
_work = diagnostics

rendering = hub
rotation = 0
checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 64
tileSizeWidth = 32
matrixTiles = 8
rows = 24
cols = 24

# ---  Also determines the window geometry
screenWidth = 256
screenHeight = 256

# ---  preparing for rotation
windowWidth = 256
windowHeight = 256

canvasWidth = 256
canvasHeight = 256

imageXOffset = 0
imageYOffset = 0

# - for small adjustments when sending to 
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 1107
windowYOffset = 535


brightness =  1.0
minBrightness = 0

usePixelSort = False
pixelSortRotatesWithImage = True
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 20
pixSortYOffset = 90
pixSortboxHeight = 344
pixSortboxWidth = 5
pixSortgap = 0
pixSortprobDraw = .7
pixSortprobGetNextColor = .9
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 2
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .99
brightnessVarHi = 1.0
pixelSortAppearanceProb = .99


## This is re-used by the dither filter
## to set the patch affected
remapImageBlock = False		
remapImageBlockSection = 0,0,256,384
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0

remapImageBlock3 = False
remapImageBlockSection3 = 64,225,128,256
remapImageBlockDestination3 = 384,128
remapImageBlockSection3Rotation = 0

remapImageBlock4 = False
remapImageBlockSection4 = 0,0,192,384
remapImageBlockDestination4 = 0,0
remapImageBlockSection4Rotation = .18


useBlur = False
blurXOffset = 0
blurYOffset = 0
blurSectionWidth = 448
blurSectionHeight = 192
sectionBlurRadius = 1

useFilters = False


[noisescroller]
#---------------------------------#
# Framerate
redrawSpeed = .04


scrollRate = 0

# amplitude of noise
noiseAmplitude = 1
pointsPerLine = 16
curveResolution = 10
rowAndColAdj = 1

function = hashlines2

rowInterval = 4
colInterval = 4
xOffset = 8
yOffset = 8

rowAndColIntervalRange = 4,8
noiseAmplitudeRange = 1.1,5

changeLinesProb = .01
lightModeProb = .5

# smoothness + speed - higher is smoother
frames = 8

line_minHue = 0
line_maxHue = 60
line_minSaturation = .0
line_maxSaturation = .90
line_minValue = .0
line_maxValue = 1.0
line_alpha = 180

bg_minHue = 0
bg_maxHue = 60
bg_minSaturation = 0
bg_maxSaturation = 0.9
bg_minValue = .0
bg_maxValue = .9
bg_alpha = 80



[diag]
#---------------------------------#

fontColor = 255,255,0
outlineColor = 255,0,0
fontColor2 = 0,0,100
bgColor = 0,0,254
showGrid = True
fontSize = 14

brightness =  .2
outerColor = 10,0,100
innerColor = 230,40,0
borderColor = 10,0,0

