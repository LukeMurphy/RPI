[displayconfig]
#--------------------------#
work = hashing-v3
# work = diagnostics
#--------------------------#

rotation = 0
fullRotation = True
rotationTrailing = False
checkForConfigChanges = True
doFullReloadOnChange =  False

tileSizeHeight = 40
tileSizeWidth = 80
matrixTiles = 32
rows = 8
cols = 8

screenWidth = 320
screenHeight = 40

windowWidth = 320
windowHeight = 40

canvasWidth = 320
canvasHeight = 40

canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 130
windowYOffset = 130

brightness =  .5
minBrightness = 0

remapImageBlock = False
remapImageBlockSection = 0,0,320,352
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0


remapImageBlock2 = False
remapImageBlockSection2 = 192,0,384,32
remapImageBlockDestination2 = 0, 64
remapImageBlockSection2Rotation = 0

remapImageBlock3 = False
remapImageBlockSection3 = 192,32,384,64
remapImageBlockDestination3 = 0, 96
remapImageBlockSection3Rotation = 0


# Note the pixels tearing dissipates after 4 levels or blocks
usePixelSort = True
pixelSortRotatesWithImage = False
pixSortDirection = lateral
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 3
pixSortboxHeight = 1
pixSortboxWidth = 320
pixSortgap = 1
pixSortprobDraw = .2
pixSortprobGetNextColor = .9
pixSortProbDecriment = 4
pixSortSizeDecriment = 2.0
pixSortSampleVariance = 2
pixSortDrawVariance = 8
randomColorProbabilty = .04
brightnessVarLow = .5
brightnessVarHi = 1.9
pixelSortAppearanceProb = .73


useFilters = False

overallResize = False
saveToFile = False
outPutPath = /Users/lamshell/Desktop/
timetotakeinterval = 5


# hatching hashing lines
[hatchingmarks]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 320
drawingHeight = 40


# more loops and tangles
tangleProb = 1.0
backTrackRange = 1,10

# grid single-lines
drawingShape = grid
renderLinesAsEnvelope = True

; imageXPOSSpeed = .1

# these really control the feel of
# activity - frenetic grid, soft undulations
# sense of randomness on or through the grid
# @todo make into mode sets

xOffset = 3
pointsPerLineCol = 28
colAdj = 1
colFirst = True
noiseAmplitudeRangeCol = 1.1,4.0
colIntervalRange = 10,37
verticalMovement = True
verticalMovementProb = .002
vertLineChangeRange = .001,.02
vertLineSpeedRange = 1,3
vertBaseWidthRange = 0,0

yOffset = 3
pointsPerLineRow = 28
rowAdj = 1
rowIntervalRange = 10,37
horizontalMovement = True
noiseAmplitudeRangeRow = 1.1,4.0
horizontalMovementProb = 0.0020
horizLineChangeRange = .001,.002
horizLineSpeedRange = 1,3
horizBaseWidthRange = 0,0

uniformRatio = False
squareRatio = False

useSingleMode = False
# these only need to be set for singleMode
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 10
# line_alpha = 180

# chance per frame the overall drawing character changes
changeLinesProb = .0004
changeBGProb = 0.0003

lightMode = False
lightModeProb = .0
lightLinesOnGroundProb = .0
lightLinesOnGround = False


pauseProb = .0002
unpauseProb = .003


# when going full black/white return to base at this per cycle
bg_alpha_returnrate = .2



#-------------------------------------------------------
#----- for blanks_and_dither_remapping module ----------
#-------------------------------------------------------

#---------------------  blanks blocks ------------------
useBlanks = True
resetBlanksProb = .0002
numberOfDeadPixels = 3
blankColorAsColorProb = .0
sizeTarget = 364,300
colsRange = 64,128
rowsRange = 32,128
blankPolyVariation = 2

#--------------------- filterRemapping  ------------------

filterRemapping = False
filterRemappingProb = .002
filterRemapMinHoriSize = 12
filterRemapMaxHoriSize = 256
filterRemapMinVertSize = 3
filterRemapMaxVertSize = 16
filterRemapRangeX = 384
filterRemapRangeY = 320

contractXSpeed = 10
contractYSpeed = 10
expandXSpeed = 10
expandYSpeed = 10

#----- adding panel modulation to mimic physical panel differences
usingPanelOverlays = False
panelColumns = 0
panelRows = 0
panelWidth = 64
panelHeight = 64
panelOverlayRange = 5,10
panelOverlayChangeProb = .001
panelOverlayAmount = .11


#---------------------  bgparameters]

paletteSets = palette_pinks,palette_all_on_naples,palette_aging

drawMoire = True
drawMoireProb = .01
drawMoireProbOff = .08

moireXPos  = 160
moireYPos  = 110
moireXDistance = 10
moireYDistance = 10

setMoireColor = True
moireColor = 0,140,60,50
moireColorAlt = 40,0,0,100
moireColorAltProb = .5

# chance that an overlay block is drawn
usebgBoxProb = .01
forceBgBox = False
useBgBox = False
clearbgBoxprob = .0003
bgBoxBox = 0,0,256,256

bgTileSizeWidthMin = 64
bgTileSizeHeightMin = 64
bgTileSizeWidthMax = 128
bgTileSizeHeightMax = 129


bgGlitchCyclesMin = 4
bgGlitchCyclesMax = 30
bgGlitchDisplacementHorizontal = 10
bgGlitchDisplacementVertical = 10

# chance that the background changes
backgroundColorChangeProb = .005

initialRunsOfBgBlocks = 30

