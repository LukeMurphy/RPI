[displayconfig]
# Pixels, Stream, Speed  -- Notes on Turner
# coloration based on Turner's painting Wind, Steam, Speed

# work = diagnostics

work = particles-v2

checkForConfigChanges = True
doFullReloadOnChange = True

rotation = 0
fullRotation = True
rotationTrailing = False

tileSizeHeight = 32
tileSizeWidth = 64
matrixTiles = 8
rows = 16
cols = 8

# ---  Also determines the window geometry
screenWidth = 768
screenHeight = 256

# ---  preparing for rotation
windowWidth = 768
windowHeight = 256

canvasWidth = 768
canvasHeight = 256


# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2647
windowYOffset = 236

brightness =  1.0
minBrightness = 0

imageXOffset = 0
imageYOffset = 0

useFilters = True
ditherfilterbrightness = 1.05

remapImageBlock = False
remapImageBlockSection = 0,0,768,256
remapImageBlockDestination = 0,0
remapImageBlockSectionRotation = 0


remapImageBlock2 = True
remapImageBlockSection2 = 256,96,320,160
remapImageBlockDestination2 = 448,96
remapImageBlockSection2Rotation = 0

remapImageBlock3 = True
remapImageBlockSection3 = 512,0,768,32
remapImageBlockDestination3 = 236,192
remapImageBlockSection3Rotation = 0

remapImageBlock4 = True
remapImageBlockSection4 = 512,32,768,64
remapImageBlockDestination4 = 256,224
remapImageBlockSection4Rotation = 0

renderDiagnostics = False

usePixelSort = True
pixelSortRotatesWithImage = False
unsharpMaskPercent = 30
pixSortboxHeight = 128
pixSortboxWidth = 768

blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 0
pixSortgap = 4
pixSortprobDraw = .001
pixSortprobGetNextColor = .1
pixSortSizeDecriment =  0
pixSortProbDecriment = 0
pixSortSampleVariance = 10
pixSortDrawVariance = 0
pixSortDirection = lateral
randomColorProbabilty = 0.0001
brightnessVarLow = .9
brightnessVarHi = .9
pixelSortAppearanceProb = 1.0
pixelSortProbChange = 0


useBlur  = False
blurXOffset = 64
blurYOffset = 0
blurSectionWidth = 192
blurSectionHeight = 128
sectionBlurRadius = 2



