#-------------------------------------------##----------------------------------------------------#
[particleSystem]
#-------------------------------------------##----------------------------------------------------#

numUnits = 390
delay = .03
slotRate = .03
restartProb = .00005

# COLOR SETTINGS
# ----------------------------------

palettes = flame-particles
paletteChangeProb = .001

# ----------------------------------
### If this is True, always creating just
### one unit when one goes off screen vs.
### bursting -- prevents flickering of the
### units when one gets removed and the
### drawing order changes mid-stream
fixedUnitArray = True
objColor = fixed
objTrails = False
trailingFade = 200
renderDiagnostics = False
# ----------------------------------

objWidth = 20
objHeight = 30
objType = rect

speedMin = .35
speedMax = 1.9

widthRate = .9992
heightRate = .9997

# ----------------------------------
#centerRangeXMin = 30
#centerRangeXMax = 320
#centerRangeYMin = -150
#centerRangeYMax = 200

centerRangeXMin = 250
centerRangeXMax = 520
centerRangeYMin = 120
centerRangeYMax = 160

# ----------------------------------

# travel fire linearMotion
movement = fire
meanderFactor = .5
meanderFactor2 = 10
meanderDirection = 0
linearMotionAlsoHorizontal = False
useFlocking = False
cohesionDistance = 40
repelDistance = 3
repelFactor = 2
clumpingFactor = 1
distanceFactor = 1
cohesionDegrades = .99
changeCohesion = False
onedirection = False

particlewinkoutxmin = 10
particlewinkoutymin = 10



xGravity = 0
yGravity = 0
xWind = 0
torquedelta = 0

ignoreBottom = False


damping = 1
collisionDamping = 1

borderCollisions = True
expireOnExit = True
reEmitNumber = 2


# ----------------------------------


useOverLay = False
overlayColor = 160,0,200,10
clrBlkWidth = 150
clrBlkHeight = 140
overlayxPos = 28
overlayyPos = 100
#overlayColor = 88,40,0,190

# ----------------------------------
# moves the dither sparkle around
