[displayconfig]
#-----------------------------------------------#
work = informal-marks
; work = diagnostics
#-----------------------------------------------#


rotation = 0
fullRotation = True
rotationTrailing = False

checkForConfigChanges = False
doFullReloadOnChange = False

tileSizeHeight = 40
tileSizeWidth = 80
matrixTiles = 8
rows = 9
cols = 4

# ---  Also determines the window geometry
screenWidth = 320
screenHeight = 360

# ---  preparing for rotation
windowWidth = 320
windowHeight = 360

canvasWidth = 320
canvasHeight = 360


# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 125
windowYOffset = 310

brightness =  1.0
minBrightness = 0

useFilters = False

remapImageBlock = False		
remapImageBlockSection = 0,0,200,300
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0


remapImageBlock2 = False
remapImageBlockSection2 = 160,320,240,360
remapImageBlockDestination2 = 240,280
remapImageBlockSection2Rotation = 0



#---------------------------------#
[informalMarksGrid]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 280
drawingHeight = 384


# more loops and tangles
backTrackRange = 1,10

renderLinesAsEnvelope = True

xOffset = 8
pointsPerLineCol = 8

#---------------------------------#
yOffset = 16
noiseAmplitudeRangeCol = .1,.210
angleRange = 40,50
angleAltRange = -8,8
sizeRange = 5
vertLineWidthRange = 0,2

colIntervalRange = 20,30
rowIntervalRange = 10,10
markMinWidth = 12
markMinHeight = 32
minXSpacing = 1
minYSpacing = 36

skipMarksProb = .05
altMarksProb = .80
marksAltColorProb = .2

#---------------------------------#
scribbleSkipMarksProb = .75
scribbleAltMarksProb = .01

scribbleCols = 18
scribbleRows = 16

scribblexOffset = 20
scribbleyOffset = 18
scibbleXPacking = 2.4
scibbleYPacking = 2.5

scribbleHeightRange = 4,5
scribbleLineBaseWidthRange = 4

scribbleRadiusXRange = 4,8
scribbleRadiusYRange = 8,12

scribblePoints = 20
scribbleLoopsRange = 2,4

scribbleNoiseXRange = 8,8
scribbleNoiseYRange = 3,4

scribbleAltColorProb = .3

#---------------------------------#

# chance per frame any line drawing character changes
changeLinesProb = .005
# chance per frame the overall drawing character changes
changeAllLinesProb = .001
# chance that the background changes
changeBGProb = 0.0008
# chance the lines get cleared when the change
clearLinesProb = .4
# no matter what, never let there be too many units
maxInformalLineUnits = 2000
#---------------------------------#


lightMode = True
lightModeProb = 1.0
lightLinesOnGroundProb = .0
lightLinesOnGround = False

pauseProb = .0002
unpauseProb = .03

#---------------------  bgparameters]

scribbleOnTop = False
singlesOnTop = True
xsOnTop = False

# when going full black/white return to base at this per cycle
bg_alpha_returnrate = 10

paletteSets =  palette_blues
; ,palette_orange,palette_pinks
; palette_pinks,palette_all_on_naples,palette_aging,palette_orange

# chance that an overlay block is drawn
usebgBoxProb = .003
forceBgBox = True
clearbgBoxprob = .0003
bgBoxBox = 0,0,128,128

bgTileSizeWidthMin = 64
bgTileSizeHeightMin = 64
bgTileSizeWidthMax = 128
bgTileSizeHeightMax = 129

bgGlitchCyclesMin = 4
bgGlitchCyclesMax = 30
bgGlitchDisplacementHorizontal = 10
bgGlitchDisplacementVertical = 10

initialRunsOfBgBlocks = 30



