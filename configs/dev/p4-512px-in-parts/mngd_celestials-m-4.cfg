PSYSpeed = 0.0

PSRadiusFactor1 = 1.0
PSRadiusFactor2 = 1.0

# the width/height max destination as
# a multiple of canvas width/height eg 5 == 1/5
xMaxFactor = 12
yMaxFactor = 12

# background alpha
backgroundAlpha = 70
backgroundAlphaMin = 60
backgroundAlphaMax = 120
backgroundAlphaDelta = -1
backgroundAlphaDeltaSpeed = .1
backgroundAlphaNewSystemThreshold = 4.0

useFixedBandColorsProb = .5
