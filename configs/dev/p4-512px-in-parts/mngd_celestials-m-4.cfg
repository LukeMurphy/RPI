slotRate = .02
pieceId = 4
numberOfCenters = 7

# the minimum and maximum radius
PSRadiusMin = 23
PSRadiusMax = 86

# the range of center positions
initXRangeMin = 32
initXRangeMax = 320
initYRangeMin = 10
initYRangeMax = 96

