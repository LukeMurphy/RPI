canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2647
windowYOffset = 736

#windowXOffset = 2785
#windowYOffset = 165

brightness =  .9
minBrightness = 0

imageXOffset = 0

remapImageBlock = False
