[displayconfig]
#----------------------------------------------------##----------------------------------------------------#
# work = diagnostics
work = voronoi_particles
#----------------------------------------------------##----------------------------------------------------#
rendering = hub
# changed to -90 from 90
rotation = -90
fullRotation = True
rotationTrailing = False
checkForConfigChanges = True
doFullReloadOnChange = True
isRPI = False


tileSizeHeight = 40
tileSizeWidth = 40
matrixTiles = 32
rows = 16
cols = 16

# ---  Also determines the window geometry
screenWidth = 480
screenHeight = 480

# ---  preparing for rotation
windowWidth = 480
windowHeight = 480

# WHEN RUNNING PIECE
canvasWidth = 200

# FOR DIAGNOSTIC and PANEL MAPPING
# canvasWidth = 480
canvasHeight = 480

# daemon7 set up FIRESIDE
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
# windowXOffset = 120
# windowYOffset = 120

# Window Offset
# windowXOffset = 2647
# windowYOffset = 60

# Window Offset
windowXOffset = 2583
windowYOffset = 38


brightness =  .9
minBrightness = 0

usePixelSort = True
pixSortDirection = medial
pixelSortRotatesWithImage = True
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 0
pixSortboxHeight = 480
pixSortboxWidth = 80
pixSortgap = 0
pixSortprobDraw = .005
pixSortprobGetNextColor = .99
pixSortSizeDecriment =  1.0
pixSortProbDecriment = .0
pixSortSampleVariance = 3
pixSortDrawVariance = 0
randomColorProbabilty = .1
brightnessVarLow = .05
brightnessVarHi = 1.0
pixelSortAppearanceProb = .99


# changed to True
useFilters = True


# added this
## This is re-used by the dither filter
## to set the patch affected
remapImageBlock = False		
remapImageBlockSection = 0,0,480,480
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0

# reverses the flow for the far-back beam
remapImageBlock2 = True
remapImageBlockSection2 = 0,40,240,80
remapImageBlockDestination2 = 0, 80
remapImageBlockSection2Rotation = 0

# completes the 128 /2-panel to the long 8 panel beam
remapImageBlock3 = True
remapImageBlockSection3 = 240,40,480,80
remapImageBlockDestination3 = 0, 120
remapImageBlockSection3Rotation = 0

# reverses first / forward beam
remapImageBlock4 = False
remapImageBlockSection4 = 0,192,480,224
remapImageBlockDestination4 = 0, 64
remapImageBlockSection4Rotation = 180


######################################################################
