[displayconfig]
#----------------------------------------------------#
work = hashing-v3
# work = diagnostics
#----------------------------------------------------#

rotation = 0
checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 64
tileSizeWidth = 64

rows = 5
cols = 6

# ---  Also determines the window geometry
screenWidth = 512
screenHeight = 128

# ---  preparing for rotation
windowWidth = 512
windowHeight = 128

canvasWidth = 512
canvasHeight = 128

imageXOffset = 0
imageYOffset = 0

# - for small adjustments when sending to 
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2583
windowYOffset = 118

brightness =  .6
minBrightness = 0

usePixelSort = False
pixelSortRotatesWithImage = True
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 20
pixSortYOffset = 90
pixSortboxHeight = 344
pixSortboxWidth = 5
pixSortgap = 0
pixSortprobDraw = .7
pixSortprobGetNextColor = .9
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 2
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .99
brightnessVarHi = 1.0
pixelSortAppearanceProb = .99


## This is re-used by the dither filter
## to set the patch affected
remapImageBlock = False		
remapImageBlockSection = 0,0,256,512
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0

remapImageBlock2 = True
remapImageBlockSection2 = 256,0,512,64
remapImageBlockDestination2 = 0,64
remapImageBlockSection2Rotation = 0

useBlur = False
blurXOffset = 0
blurYOffset = 0
blurSectionWidth = 512
blurSectionHeight = 64
sectionBlurRadius = 1

useFilters = False

# ############################################## #
# hatching hashing lines

[hatchingmarks]
#---------------------------------#
# Framerate
redrawSpeed = .05
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 511
drawingHeight = 64

# more loops and tangles
tangleProb = 0.0
backTrackRange = 1,10

# grid single-lines
drawingShape = grid
renderLinesAsEnvelope = True

# these really control the feel of
# activity - frenetic grid, soft undulations
# sense of randomness on or through the grid
# @todo make into mode sets

xOffset = 0
pointsPerLineCol = 4
colAdj = 1
colFirst = True
noiseAmplitudeRangeCol = .3,.30
colIntervalRange = 7,37
verticalMovement = True
verticalMovementProb = .020
vertLineChangeRange = .01,.02
vertLineSpeedRange = 1,3
vertBaseWidthRange = 0,0

yOffset = 1
pointsPerLineRow = 28
rowAdj = 1
rowIntervalRange = 2,9
noiseAmplitudeRangeRow = .1,2.0
horizontalMovement = True
horizontalMovementProb = 0.020
horizLineChangeRange = .01,.02
horizLineSpeedRange = 1,3
horizBaseWidthRange = 0,2

uniformRatio = False
squareRatio = False
useSingleMode = False

# these only need to be set for singleMode
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 10
# line_alpha = 180

# chance per frame the overall drawing character changes
changeLinesProb = .0001
changeBGProb = 0.001

lightMode = False
lightModeProb = .0
lightLinesOnGroundProb = .0
lightLinesOnGround = False


pauseProb = .0002
unpauseProb = .003


# when going full black/white return to base at this per cycle
bg_alpha_returnrate = .2


#--------------------- blanks blocks
blankColorAsColorProb = .0
resetBlanksProb = .001
numberOfDeadPixels = 2
colsRange = 32,128
rowsRange = 16,64
sizeTarget = 480,32
blankPolyVariation = 1

#--------------------- filterRemapping  ------------------

filterRemapping = True
filterRemappingProb = .002
filterRemapMinHoriSize = 12
filterRemapMaxHoriSize = 256
filterRemapMinVertSize = 3
filterRemapMaxVertSize = 16
filterRemapRangeX = 1000
filterRemapRangeY = 64

contractXSpeed = 10
contractYSpeed = 10
expandXSpeed = 10
expandYSpeed = 10


#---------------------  bgparameters]

paletteSets = palette_pinks,palette_all_on_naples,palette_aging

bgBoxColorRanges = 345,10,.50,1.0,.2,1.0,0,0|180,66,.750,1.0,.2,1.0,0,0|34,48,.750,1.0,.62,1.0,0,0
bgBoxAlphaRange = 40,248


drawMoire = True
drawMoireProb = .01
drawMoireProbOff = .08

moireXPos  = 160
moireYPos  = 110
moireXDistance = 10
moireYDistance = 10

setMoireColor = True
moireColor = 0,140,60,50
moireColorAlt = 40,0,0,100
moireColorAltProb = .5

# chance that an overlay block is drawn
usebgBoxProb = .01
clearbgBoxprob = .0003
bgBoxBox = 0,0,256,256

bgTileSizeWidthMin = 64
bgTileSizeHeightMin = 64
bgTileSizeWidthMax = 128
bgTileSizeHeightMax = 129

forcebgBox = True

bgGlitchCyclesMin = 4
bgGlitchCyclesMax = 30
bgGlitchDisplacementHorizontal = 10
bgGlitchDisplacementVertical = 10

# chance that the background changes
backgroundColorChangeProb = .005

initialRunsOfBgBlocks = 30

