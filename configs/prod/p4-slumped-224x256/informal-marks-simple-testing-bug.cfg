[displayconfig]
# --------------------------------------------------#
work = informal-marks
; work = diagnostics
# --------------------------------------------------#

rotation = 0
fullRotation = True
rotationTrailing = False

checkForConfigChanges = False
doFullReloadOnChange = False

tileSizeHeight = 32
tileSizeWidth = 64
matrixTiles = 48
rows = 8
cols = 4

# ---  Also determines the window geometry
screenWidth = 256
screenHeight = 321

# ---  preparing for rotation
windowWidth = 256
windowHeight = 321

canvasWidth = 256
canvasHeight = 321

# daemon7 set up FIRESIDE
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 150
windowYOffset = 151

brightness =  .8
minBrightness = 0

useFilters = False
ditherfilterbrightness = .99

remapImageBlock = False
remapImageBlockSection = 0,0,256,256
remapImageBlockDestination = 0,0
remapImageBlockSectionRotation = 0

remapImageBlock2 = False
remapImageBlockSection2 = 0,220,160,256
remapImageBlockDestination2 = 1,220
remapImageBlockSection2Rotation = 1

remapImageBlock3 = False
remapImageBlockSection3 = 224,0,256,384
remapImageBlockDestination3 = 0,0
remapImageBlockSection3Rotation = 0


#---------------------------------#
[informalMarksGrid]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 256
drawingHeight = 320


# more loops and tangles
backTrackRange = 1,10
renderLinesAsEnvelope = False

xOffset = 8
pointsPerLineCol = 8

#---------------------------------#
yOffset = 20
noiseAmplitudeRangeCol = .01,2.10
angleRange = 10,60
angleAltRange = -10,10
sizeRange = 5
vertLineWidthRange = 0,2

markMinWidth = 60
markMinHeight = 60
minXSpacing = 40
minYSpacing = 80
colIntervalRange = 2,2
rowIntervalRange = 3,3
skipMarksProb = .0
altMarksProb = .610
marksAltColorProb = .15


; yOffset = 8
; noiseAmplitudeRangeCol = .1,1.210
; angleRange = 10,60
; angleAltRange = -12,12
; sizeRange = 5
; vertLineWidthRange = 0,2
; colIntervalRange = 20,22
; rowIntervalRange = 12,12
; markMinWidth = 11
; markMinHeight = 30
; minXSpacing = 2
; minYSpacing = 26
; skipMarksProb = .25
; altMarksProb = .610
; marksAltColorProb = .15

#---------------------------------#
scribbleSkipMarksProb = .90
scribbleAltMarksProb = .00

scribblexOffset = 50
scribbleyOffset = 70
scibbleXPacking = 5.1
scibbleYPacking = 3.2

scribbleHeightRange = 10,20
scribbleLineBaseWidthRange = 5

scribbleRadiusXRange = 10,20
scribbleRadiusYRange = 18,22

scribblePoints = 10
scribbleLoopsRange = 2,3

scribbleNoiseXRange = 10,10
scribbleNoiseYRange = 10,10

scribbleRows = 3
scribbleCols = 2
; scribbleRows = 11
; scribbleCols = 18

scribbleAltColorProb = .2

#---------------------------------#

# chance per frame any line drawing character changes
changeLinesProb = .001
# chance per frame the overall drawing character changes
changeAllLinesProb = .001
# chance the lines get cleared when the change
clearLinesProb = .1
# chance that the background changes
changeBGProb = 0.001


lightMode = False
lightModeProb = .00
lightLinesOnGroundProb = .0
lightLinesOnGround = False

pauseProb = .0002
unpauseProb = .003

scribbleOnTop = False
singlesOnTop = False
xsOnTop = True

#---------------------  bgparameters]
# when going full black/white return to base at this per cycle
bg_alpha_returnrate = 10
paletteSets = palette_orange,palette_pinks,palette_aging
; ,palette_pinks
; ,palette_all_on_naples
; ,palette_aging

# chance that an overlay block is drawn
usebgBoxProb = .0005
forceBgBox = True
; forceBgBox = True
clearbgBoxprob = .001
bgBoxBox = 0,0,256,256

bgTileSizeWidthMin = 64
bgTileSizeHeightMin = 64
bgTileSizeWidthMax = 128
bgTileSizeHeightMax = 129

bgGlitchCyclesMin = 4
bgGlitchCyclesMax = 30
bgGlitchDisplacementHorizontal = 10
bgGlitchDisplacementVertical = 10

initialRunsOfBgBlocks = 2


