[displayconfig]

work = vertical
# work = diagnostics

rendering = hub
rotation = -180
fullRotation = True
rotationTrailing = False
isRPI = False
useFilters = False

checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 32
tileSizeWidth = 64
matrixTiles = 48
rows = 8
cols = 10

## Also determines the window geometry
screenWidth = 256
screenHeight = 256

# preparing for rotation
# if 90 degree rotated, make height same as screen width
canvasWidth = 256
canvasHeight = 256

# for small adjustments when sending to matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2713
windowYOffset = 118

brightness =  1.0
minBrightness = 0

remapImageBlock = False
remapImageBlockSection = 0,0,256,256
remapImageBlockDestination = 0,0

[diag]
# --------------------------------------------------#
fontColor = 100,100,0
outlineColor = 100,0,0
fontColor2 = 0,0,255
bgColor = 0,0,50
showGrid = True
fontSize = 9

brightness = .2
outerColor = 10,0,100
innerColor = 230,40,0
borderColor = 10,0,0



[vertical]
drawCenteringLines = False
vOffset = 0
redrawSpeed = .03
rateMultiplier = 3

brightness =  1.0
outerColor = 10,0,100
innerColor = 230,40,0
borderColor = 210,0,0

### virtical variations
### h should be same as blockHeight 
### unless gaps are wanted
blockHeight = 24
h = 8
verticalSpeed = 1


### horizontal variation
### higher makes it less flame-like
var = 5
varMulitplierWhenChangingUp = 8
varMulitplierWhenChangingDown = 8

minPercentWidth = 0.0001
maxPercentWidth = .45

destinationPercentage = .25
widthPercentage = .2
multiplier = .998
incrRate = 1.02
reduceRate = .995

# glitch or waver probablility
# best to keep low to lull the viewer
# into calm

inMotionProbability = .11
