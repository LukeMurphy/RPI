[displayconfig]
# prostrate at the alter of the grid .... ;)
work = informal-marks
; work = diagnostics


rotation = 0
fullRotation = True
rotationTrailing = False

checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 32
tileSizeWidth = 64
matrixTiles = 48
rows = 7
cols = 9

# ---  Also determines the window geometry
screenWidth = 576
screenHeight = 256

# ---  preparing for rotation
windowWidth = 576
windowHeight = 256

canvasWidth = 576
canvasHeight = 256

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2647
windowYOffset = 118

brightness = 1.0
minBrightness = 0

#work = squares
#rotation = 0
#screenWidth = 320
#screenHeight = 192
#canvasWidth = 320
#canvasHeight = 192

remapImageBlock = False
remapImageBlockSection = 0,0,64,384
remapImageBlockDestination = 0,0
remapImageBlockSectionRotation = 0

remapImageBlock2 = False
remapImageBlockSection2 = 0,220,160,256
remapImageBlockDestination2 = 1,220
remapImageBlockSection2Rotation = 1

remapImageBlock3 = False
remapImageBlockSection3 = 224,0,256,384
remapImageBlockDestination3 = 0,0
remapImageBlockSection3Rotation = 0


remapImageBlockShift = True
remapImageBlockShiftSection = 256,0,512,128
remapImageBlockShiftStableSection = 0,0,576,256
remapImageBlockShiftDestination = 320,0

usePixelSort = False
pixelSortRotatesWithImage = False
pixSortDirection = lateral
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = -2
pixSortboxHeight = 1
pixSortboxWidth = 192
pixSortgap = 0
pixSortprobDraw = .02
pixSortprobGetNextColor = 1
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 12
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .9
brightnessVarHi = 1.1
pixelSortAppearanceProb = .99

useBlur = False
blurXOffset = 120
blurYOffset = 120
blurSectionWidth = 90
blurSectionHeight = 20
sectionBlurRadius = 2

useFilters = False
ditherfilterbrightness = 1.1



[informalMarksGrid]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 576
drawingHeight = 256


# more loops and tangles
backTrackRange = 1,10

renderLinesAsEnvelope = True

xOffset = 8
pointsPerLineCol = 8

#---------------------------------#
yOffset = 8
noiseAmplitudeRangeCol = .1,1.210
angleRange = 10,60
angleAltRange = -12,12
sizeRange = 5
vertLineWidthRange = 0,2

colIntervalRange = 39,39
rowIntervalRange = 6,6
markMinWidth = 16
markMinHeight = 40
minXSpacing = 2
minYSpacing = 36

skipMarksProb = .25
altMarksProb = .610
marksAltColorProb = .2

#---------------------------------#
scribbleSkipMarksProb = .85
scribbleAltMarksProb = .00

scribblexOffset = 20
scribbleyOffset = 10
scibbleXPacking = 3.1
scibbleYPacking = 2.4


scribbleHeightRange = 4,5
scribbleLineBaseWidthRange = 5

scribbleRadiusXRange = 4,8
scribbleRadiusYRange = 8,12

scribblePoints = 10
scribbleLoopsRange = 2,3

scribbleNoiseXRange = 5,5
scribbleNoiseYRange = 1,2

scribbleRows = 11
scribbleCols = 18

scribbleAltColorProb = .3

#---------------------------------#

# chance per frame any line drawing character changes
changeLinesProb = .01
# chance per frame the overall drawing character changes
changeAllLinesProb = .0004
# chance that the background changes
changeBGProb = 0.001


lightMode = True
lightModeProb = .85
lightLinesOnGroundProb = .0
lightLinesOnGround = False

pauseProb = .0002
unpauseProb = .003

#---------------------  bgparameters]
# when going full black/white return to base at this per cycle
bg_alpha_returnrate = 10

paletteSets = palette_pinks,palette_all_on_naples,palette_aging

# chance that an overlay block is drawn
usebgBoxProb = .01
forceBgBox = False
useBgBox = False
clearbgBoxprob = .0003
bgBoxBox = 0,0,256,256

bgTileSizeWidthMin = 64
bgTileSizeHeightMin = 64
bgTileSizeWidthMax = 128
bgTileSizeHeightMax = 129

bgGlitchCyclesMin = 4
bgGlitchCyclesMax = 30
bgGlitchDisplacementHorizontal = 10
bgGlitchDisplacementVertical = 10

initialRunsOfBgBlocks = 30



