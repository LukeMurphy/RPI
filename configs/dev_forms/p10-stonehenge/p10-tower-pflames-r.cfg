[particleSystem]
#-----------------------------------------------#
numUnits = 200

xGravity = 0
yGravity = -.10

ignoreBottom = True

restartprob = .001

speedMin = .5
speedMax = 2

#initial direction 3.14/2
variance = 1
meanderfactor = .95

objWidth = 18
objHeight = 53
objType = rect
objTrails = True

widthRate = .96
heightRate = .98

overallBlur = 1
unitBlur = 0

objColor = set

## bluescreen
fillColor = 0,0,0,0
outlineColor = 0,0,0,0
bgColor = 0,0,0,0

useSecondColorProb = 0
fillColor2 = 0,0,0,0
outlineColor2 = 0,0,0,0

pUseHSV = True
pFillRange = 0,0,.80,1.0,.5,1.0,100,220
pOutlineRange = 0,0,.50,1.0,.3,1.0,100,200

# OVERRIDES THE OLDER COLOR SETTINGS
usePalettes =  True
palettes = midnightBlue,pinkSacrifice,midnightBlue
paletteChangeProb = .001

#*** Transparency of particle elements
#*** if drawn as rectangles etc
transparencyRange = 10,130

#************
useOverLay = False
useOverLayEnhanced = False
clrBlkWidth = 100
clrBlkHeight = 200
overlayxPos = 0
overlayyPos = 0
overlayColor = 0,0,0,0

pixelsGoGray = False
jumpToGray = False
pixelsGoGrayModel = 1

# backgroundColor controls
bgTransitions = True
bgRangeA = 10
bgRangeB = 30
tLimitBase = 20
minHue = 0
maxHue = 0
minSaturation = .8
maxSaturation = 1.0
minValue = .1
maxValue = .8


#************ should be 25
bgTransparency = 25
maxBrightness = .55

centerRangeXMin = -10
centerRangeXMax = 20
centerRangeYMin = -142
centerRangeYMax = 25

damping = 1
collisionDamping = 1

borderCollisions = True
expireOnExit = True
reEmitNumber = 2
### If this is True, always creating just
### one unit when one goes off screen vs.
### bursting -- prevents flickering of the
### units when one gets removed and the
### drawing order changes mid-stream
fixedUnitArray = True

movement = fire
useFlocking = False
cohesionDistance = 40
repelDistance = 1
repelFactor = 1
clumpingFactor = 1
distanceFactor = 1
cohesionDegrades = 1
changeCohesion = False

