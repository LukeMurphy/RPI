[displayconfig]
; -----------------------------------------------
# P4mm tower work on 12" construction beam wood
# cut for me by David Mabbot so that the piece is
# 2 degrees off-vertical while the top and base planes
# are horizontal
# August 2024
work = screen_updated
; -----------------------------------------------

checkForConfigChanges = True
doFullReloadOnChange = True

rotation = 0
fullRotation = True
rotationTrailing = False


tileSizeHeight = 32
tileSizeWidth = 64
matrixTiles = 48
rows = 7
cols = 9

# ---  Also determines the window geometry
screenWidth = 578
screenHeight = 258

# ---  preparing for rotation
windowWidth = 578
windowHeight = 258

canvasWidth = 578
canvasHeight = 258

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# ----------------------------------------------------------- #

# Window Offset
windowXOffset = 119
windowYOffset = 119

# ----------------------------------------------------------- #

brightness = 1.0
minBrightness = 0

useFilters = True
ditherfilterbrightness = 1.1

# ----------------------------------------------------------- #

remapImageBlock = False
remapImageBlockSection = 0,0,64,384
remapImageBlockDestination = 0,0
remapImageBlockSectionRotation = 0

remapImageBlock2 = False
remapImageBlockSection2 = 0,220,160,256
remapImageBlockDestination2 = 1,220
remapImageBlockSection2Rotation = 1

remapImageBlock3 = False
remapImageBlockSection3 = 224,0,256,384
remapImageBlockDestination3 = 0,0
remapImageBlockSection3Rotation = 0

# ----------------------------------------------------------- #

remapImageBlockShift = True
remapImageBlockShiftSection = 256,0,512,128
remapImageBlockShiftStableSection = 0,0,576,256
remapImageBlockShiftDestination = 320,0

# ----------------------------------------------------------- #

[screenproject]
#-----------------------------------------------#
delay = .03
slotRate = .03


crackColor = 100,100,100,3
outlineColor = 160,200,240,50
bgColor = 180,20,24,5
## Needs to be odd number ...
numCracks = 7
pointsCount = 5
drawCracks = False
origin = 15,4

## Used when first creating the cracks
yVarMin = 6
yVarMax = 36

randomColorSampleProb = .01

probDrawBoxes = .1
probDrawLines = .1
probDrawPerpLines = .1
probDrawVertLines = .991
crackChangeProb = .1
imageResetProb = .001

timeTrigger = True

pauseProb = .001
unpauseProb = .005

## This controls the range of background colors
tLimitBase = 10
minHue = 0
maxHue = 360
minSaturation = .99
maxSaturation = 1
minValue = .99
maxValue = .99
maxBrightness = .99
dropHueMin = 50
dropHueMax = 170

probabilitymultiplierrange = .5


filterremapping = True
filterremappingprob = .1
filterremapminhorisize = 256
filterremapminvertsize = 256
filterremaprangex = 120
filterremaprangey = 120

pixelsortprobon = .01
pixelsortproboff = .01

blackOutProb = .0003
blackOutProbOff = .02
blackOutBlock = 256,384
