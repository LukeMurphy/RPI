[displayconfig]
#--------------------------#
work = scrolling_image
; work = diagnostics
#--------------------------#

rotation = 0
fullRotation = True
rotationTrailing = False
checkForConfigChanges = False
doFullReloadOnChange =  False

tileSizeHeight = 40
tileSizeWidth = 80
matrixTiles = 32
rows = 8
cols = 8

screenWidth = 320
screenHeight = 80

windowWidth = 320
windowHeight = 80

canvasWidth = 320
canvasHeight = 80

canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
; windowXOffset = 2583
; windowYOffset = 118
windowXOffset = 103
windowYOffset = 99

brightness =  .99
minBrightness = 0

remapImageBlock = False
remapImageBlockSection = 0,0,320,352
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0


remapImageBlock2 = False
remapImageBlockSection2 = 0,0,320,80
remapImageBlockDestination2 = 0, 0
remapImageBlockSection2Rotation = -180

remapImageBlock3 = False
remapImageBlockSection3 = 192,32,384,64
remapImageBlockDestination3 = 0, 96
remapImageBlockSection3Rotation = 0

remapImageBlockShift = True
remapImageBlockShiftSection = 0,0,320,40
remapImageBlockShiftStableSection = 0,0,320,40
remapImageBlockShiftDestination = 0,40


# Note the pixels tearing dissipates after 4 levels or blocks
usePixelSort = True
pixelSortRotatesWithImage = False
pixSortDirection = lateral
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 3
pixSortboxHeight = 1
pixSortboxWidth = 320
pixSortgap = 1
pixSortprobDraw = .2
pixSortprobGetNextColor = .9
pixSortProbDecriment = 4
pixSortSizeDecriment = 2.0
pixSortSampleVariance = 2
pixSortDrawVariance = 8
randomColorProbabilty = .04
brightnessVarLow = .5
brightnessVarHi = 1.9
pixelSortAppearanceProb = .73


useFilters = False

overallResize = False
saveToFile = False
outPutPath = /Users/lamshell/Desktop/
timetotakeinterval = 5

[scrollingImage]

redrawSpeed = .03
slotRate = .0333

# baseImage = assets/imgs/spritesheets/mile-h2.png
# baseImage = assets/imgs/spritesheets/mile-h2-70-percent.png
baseImage = assets/imgs/spritesheets/mile-h2-red.png
# baseImage = assets/imgs/spritesheets/mile-h2b.png
segmentWidth = 1472
segmentHeight = 32

xOffSet = 0
yOffSet = 0

# set to 0 or 1 to use image height
resizeHeight = 32

# this sets the desired size of drawing
# to scale up to - so 1609344mm = 1 mile
# mmSizeOfDrawing = 1000000
mmSizeOfDrawing = 1609344

# the dot-pitch of the display
mmPerPixel = 5

# the desired apparent speed
speedMPH = 3

# this is ignored if mph is set
speedX = 12
# speedKmPH = 0


# background color HSV ranges
bg_minHue = 340
bg_maxHue = 25
bg_minSaturation = .90
bg_maxSaturation = 1.0
bg_minValue = .3
bg_maxValue = .5
bg_dropHueMinValue = 0
bg_dropHueMaxValue = 0
# background color alpha 
bg_alpha = 150
# chance that the background changes
backgroundColorChangeProb = .01

# moves the dither sparkle around
filterRemapping = True
filterRemappingProb = .004
filterRemapHorizSize = 448
filterRemapVertSize = 240
filterRemapMinHorizSize = 448
filterRemapMinVertiSize = 240

filterRemapRangeX = 0
filterRemapRangeY = 60



[diag]
fontColor = 255,255,0
outlineColor = 255,0,0
fontColor2 = 0,0,100
bgColor = 0,0,254
showGrid = True
fontSize = 14

brightness =  .2
outerColor = 10,0,100
innerColor = 230,40,0
borderColor = 10,0,0
