[displayconfig]
# --------------------------------------------------#
work = actionmarks_v3_1
# heavy outlines, cartoon / comic / graphic look for testing
# work = diagnostics
# --------------------------------------------------#

rotation = 0
checkForConfigChanges = False
doFullReloadOnChange = False

tileSizeHeight = 32
tileSizeWidth = 64

rows = 12
cols = 9

# ---  Also determines the window geometry
screenWidth = 512
screenHeight = 224

# ---  preparing for rotation
windowWidth = 512
windowHeight = 224

canvasWidth = 512
canvasHeight = 224

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 105
windowYOffset = 150

brightness = 1.0
minBrightness = 0

imageXOffset = 0
imageYOffset = 0

remapImageBlock = False
remapImageBlockSection = 0,0,32,22
remapImageBlockDestination = 0,0

remapImageBlock2 = False
remapImageBlockSection2 = 0,96,768,128
remapImageBlockDestination2 = 512,0

remapImageBlock3 = False
remapImageBlockSection3 = 512,0,576,32
remapImageBlockDestination3 = 0,32

remapImageBlock4 = False
remapImageBlockSection4 = 576,0,768,32
remapImageBlockDestination4 = 0,64

remapImageBlockShift = False
remapImageBlockShiftSection = 0,128,268,512
remapImageBlockShiftStableSection = 0,0,268,128
remapImageBlockShiftDestination = 38,128

usePixelSort = False
pixelSortRotatesWithImage = False
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 0
pixSortboxHeight = 192
pixSortboxWidth = 1
pixSortgap = 0
pixSortprobDraw = .7
pixSortprobGetNextColor = 1
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 12
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .9
brightnessVarHi = 1.1
pixelSortAppearanceProb = .99

useBlur = False
blurXOffset = 120
blurYOffset = 120
blurSectionWidth = 90
blurSectionHeight = 20
sectionBlurRadius = 2

useFilters = True
ditherfilterbrightness = .95

# --------------------------------------------------#
[drawingField]

slotRate = .03

# change the drawing mode
changeDrawingModeTime = 220
# if this is too high, it all gets "poppy"
bgColorAlpha = 10
# chance, per cycle, move the dither around
filterremappingprob = .002
# chance, per cycle, that overlay blocks are cleared
# not realy that useful because the composite image is
# always being added to so retains a continuous pile
# of layers
clearbgBoxprob = .0003

# change Palette and Drawing
changeColorSetTime = 73

# the range of time is any time between (changeColorSetTime) and (changeColorSetTime X changeColorSetTimeMaxMultiplier)
# so if the base is 40 and multiplier is 3, the palette set will chang any time between 40 seconds and 120 seconds
changeColorSetTimeMaxMultiplier = 4


# rate per cycle that a new bg is blended-in
blendLevelRateBase = .01

changeBGColorProb = .001

totalRandomPenColorProb = .5
totalRandomBGBoxColorProb = .02

# chance, per cycle, that the line drawing jitters
doJitterProb = .01
# probablility that after drawing jitter happens
doJitterWhenAddingBGUseProb = .50
# probablility that after LINE jitter happens
doJitterAfterLineUseProb = .50
jitterIterationsMin = 1
jitterIterationsMax = 30
jitterIterationsMaxAfterDraw = 3
jitterDisplacementHorizontal =6
jitterDisplacementVertical = 6



penAlpha = 200

# time to clear the canvas
changeTime = 0

fadeRateNewSystemThreshold = 2.0

# this guy is presented rotated -90
# so adjusting so the horizontal dither
# banding appears a more vertically biased
filterremapping = True
filterRemapMinHorzSize = 60
filterRemapMaxHorzSize = 512
filterRemapRangeX = 512
filterRemapMinVertSize = 8
filterRemapMaxVertSize = 224
filterRemapRangeY = 224

innerRadius = 50
outerRadius = 700

usebgBox = False
usebgBoxProb = .005
bgBoxBox = 0,0,512,224
bgTileSizeWidthMin = 117
bgTileSizeWidthMax = 512
bgTileSizeHeightMin = 117
bgTileSizeHeightMax = 224

bgBoxAlphaRange = 40,248
forcebgBox = True

compositionModeChangeProb = .01

justHitPauseProb = .0005
releaseFromJustHitPauseProb = .005

# --------------------------------------------------#

# ************************************************* #
# textures are in configs/asset_configs/textures
# pens and marks are in configs/asset_configs/marks
# ************************************************* #
# as defined in this file

drawingBundle = prod/landscaper-actionmarks-bundle-384px


paletteSets = lasttwomblyxs,
            BathersWithTurtle2,
            dekoonig_v2a,
            PostItNotesBlueInk2_v2,
            scribbles






