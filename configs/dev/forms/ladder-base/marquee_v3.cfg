[displayconfig]
#-----------------------------------------------#

work = marquee_3
# work = diagnostics
#--------------------------#


# not necessarily 90 rotated
rotation = 0
fullRotation = True
rotationTrailing = False
checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 32
tileSizeWidth = 64
matrixTiles = 30

rows = 2
cols = 14

# ---  Also determines the window geometry
screenWidth = 896
screenHeight = 128

# ---  preparing for rotation
windowWidth = 896
windowHeight = 128

canvasWidth = 896
canvasHeight = 128

# - for small adjustments when sending to 
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2647
windowYOffset = 736

#windowXOffset = 2785
#windowYOffset = 165

brightness =  .7
minBrightness = 0

imageXOffset = 0

remapImageBlock = False
remapImageBlockSection = 0,0,896,128
remapImageBlockDestination = 0,0

remapImageBlock2 = True
remapImageBlockSection2 = 256,0,512,32
remapImageBlockDestination2 = 0,32

remapImageBlock3 = True
remapImageBlockSection3 = 512,0,768,32
remapImageBlockDestination3 = 0,64

remapImageBlock4 = True
remapImageBlockSection4 = 768,0,896,32
remapImageBlockDestination4 = 128,96

usePixelSort = False
pixelSortRotatesWithImage = True
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 0
pixSortboxHeight = 256
pixSortboxWidth = 256
pixSortgap = 1
pixSortprobDraw = .51
pixSortprobGetNextColor = 1
pixSortProbDecriment = 1
pixSortSizeDecriment = 0
pixSortSampleVariance = 4
pixSortDrawVariance = 1
randomColorProbabilty = .005
brightnessVarLow = .5
brightnessVarHi = 1.1
pixelSortAppearanceProb = 1

useFilters = False
ditherFilterBrightness = .95


useBlur  = False
blurXOffset = 0
blurYOffset = 0
blurSectionWidth = 256
blurSectionHeight = 128
sectionBlurRadius = 2




[diag]
#--------------------------#
fontColor = 255,255,0
outlineColor = 255,0,0
fontColor2 = 0,0,100
bgColor = 0,0,254
showGrid = True
fontSize = 14

brightness =  .8
outerColor = 10,0,100
innerColor = 230,40,0
borderColor = 10,0,0



[marquee]
#-----------------------------------------------#
redrawSpeed = .02
slotRate  = .02

marqueeImageWidth = 896
marqueeImageHeight = 32

# interImages = 0
aliasMode = True
animationRate  = .03
advanceStepMax = 4
aliasAlpha = 50

changePaletteInterval = 20
# the number of rings drawn
marqueeNum = 5

# relative width of each ring or band
marqueeWidth = 2
# the size of the background block or stripe
baseDashSize = 17
# the gap between bands or rings
gap = 1
maxRandomGap = 4
# chance that when the palettes change the whole piece rebuilds
rebuildAllProb = .5

step = 2
decrement = 1
randomRange = 200.0

fontsize = 44
shadowSize = 1

proportionalPatternSize = True

# the range of steps in the transition between colors
# very low and the chages are abrupt
randomRangeMin = 20
randomRangeMax = 60

# mulitColor False means all marquees use
# the same two colors
multiColor = True

# palettes are in groups of two
# each couplet or tuple represents the two colors
# on each marquee line

paletteSets = warm-all,warm-all2|wintersun-p1,wintersun-p2|cool,warm
# paletteSets = warm-all,warm-all2
# paletteSets = cool,warm
# paletteSets = wintersun-p1,wintersun-p2



# pure warm and cool 
[warm]
minHue = 330 
maxHue = 40
minSaturation = .85
maxSaturation = 1.0
minValue = .5
maxValue = 1.0

[cool]
minHue = 140 
maxHue = 190
minSaturation = .5
maxSaturation = 1.0
minValue = .1
maxValue = .5

# WinterSun
[wintersun-p1]
minHue = 30
maxHue = 50
minSaturation = .2
maxSaturation = 1.0
minValue = .9
maxValue = 1.1

[wintersun-p2]
minHue = 180
maxHue = 260
minSaturation = .1
maxSaturation = 1.0
minValue = .1
maxValue = .95


# Warm rug textile
[warm-all]
minHue = 340 
maxHue = 36
minSaturation = .6
maxSaturation = 1.0
minValue = .2
maxValue = 1.0

[warm-all2]
minHue = 340 
maxHue = 45
minSaturation = .2
maxSaturation = 1.0
minValue = .2
maxValue = 1.0

