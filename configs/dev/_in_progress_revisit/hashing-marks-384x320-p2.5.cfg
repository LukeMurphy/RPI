[displayconfig]
#--------------------- 
work = hashing
# work = diagnostics
#--------------------- 

rotation = 0
checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 64
tileSizeWidth = 64

rows = 5
cols = 6

# ---  Also determines the window geometry
screenWidth = 384
screenHeight = 320

# ---  preparing for rotation
windowWidth = 384
windowHeight = 320

canvasWidth = 384
canvasHeight = 320

imageXOffset = 0
imageYOffset = 0

# - for small adjustments when sending to 
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2910
windowYOffset = 118


brightness =  1.0
minBrightness = 0

usePixelSort = False
pixelSortRotatesWithImage = True
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 20
pixSortYOffset = 90
pixSortboxHeight = 344
pixSortboxWidth = 5
pixSortgap = 0
pixSortprobDraw = .7
pixSortprobGetNextColor = .9
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 2
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .99
brightnessVarHi = 1.0
pixelSortAppearanceProb = .99


## This is re-used by the dither filter
## to set the patch affected
remapImageBlock = False		
remapImageBlockSection = 0,0,256,384
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0

remapImageBlock3 = False
remapImageBlockSection3 = 64,225,128,256
remapImageBlockDestination3 = 384,128
remapImageBlockSection3Rotation = 0

remapImageBlock4 = False
remapImageBlockSection4 = 0,0,192,384
remapImageBlockDestination4 = 0,0
remapImageBlockSection4Rotation = .18


useBlur = False
blurXOffset = 0
blurYOffset = 0
blurSectionWidth = 448
blurSectionHeight = 192
sectionBlurRadius = 1

useFilters = False

# ################################################### #
# hatching hashing lines

[hatchingmarks]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

xOffset = 11
pointsPerLineCol = 28
colInterval = 60
colIntervalRange = 20,80
colAdj = 1

yOffset = 8
pointsPerLineRow = 28
rowInterval = 50
rowIntervalRange = 20,80
rowAdj = 1

uniformRatio = False
squareRatio = False

noiseAmplitude = 2
noiseAmplitudeRange = 1.8,4


# these really control the feel of
# activity - frenetic grid, soft undulations
# sense of randomness on or through the grid
# @todo make into mode sets
useSingleMode = False

# these only need to be set for singleMode
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 10
# line_alpha = 180

# chance per frame the overall drawing character changes
changeLinesProb = .001
changeBGProb = 0.001
lightModeProb = .1

pauseProb = .002
unpauseProb = .003

vertLineChangeRange = .01,.1
horizLineChangeRange = .01,.1
bg_alpha_range = 10,10
line_alpha_range = 18,20
# when going full black/white return to base at this per cycle
bg_alpha_returnrate = .2

# dense, dark with fast undulations that
# emphasize the lowest row or column spacing
# because more light space appears
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 10
# line_alpha = 180

# most active
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 40
# line_alpha = 180

# soft frenzy
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 40
# line_alpha = 18

# soft stasis
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 10
# line_alpha = 18

# softer
# vertLineChange = 0.15
# horizLineChange = 0.05
# bg_alpha = 10
# line_alpha = 18

# smoothness + speed - higher is smoother
frames = 8
scrollRate = 0

line_minHue = 0
line_maxHue = 60
line_minSaturation = .0
line_maxSaturation = .90
line_minValue = .0
line_maxValue = 1.0

bg_minHue = 355
bg_maxHue = 60
bg_minSaturation = 0.2
bg_maxSaturation = 0.6
bg_minValue = .4
bg_maxValue = .9
bg_dropHueMin = 11
bg_dropHueMax = 50




[diag]
#---------------------------------#

fontColor = 255,255,0
outlineColor = 255,0,0
fontColor2 = 0,0,100
bgColor = 0,0,254
showGrid = True
fontSize = 14

brightness =  .2
outerColor = 10,0,100
innerColor = 230,40,0
borderColor = 10,0,0

