[displayconfig]

work = hashing
# work = diagnostics

rendering = hub
rotation = 0
checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 64
tileSizeWidth = 64

rows = 5
cols = 6

# ---  Also determines the window geometry
screenWidth = 512
screenHeight = 132

# ---  preparing for rotation
windowWidth = 512
windowHeight = 132

canvasWidth = 512
canvasHeight = 132

imageXOffset = 0
imageYOffset = 0

# - for small adjustments when sending to 
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 0

# Window Offset
windowXOffset = 2583
windowYOffset = 118

brightness =  1.0
minBrightness = 0

usePixelSort = False
pixelSortRotatesWithImage = True
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 20
pixSortYOffset = 90
pixSortboxHeight = 344
pixSortboxWidth = 5
pixSortgap = 0
pixSortprobDraw = .7
pixSortprobGetNextColor = .9
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 2
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .99
brightnessVarHi = 1.0
pixelSortAppearanceProb = .99


## This is re-used by the dither filter
## to set the patch affected
remapImageBlock = False		
remapImageBlockSection = 0,0,256,384
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0

remapImageBlock2 = True
remapImageBlockSection2 = 256,4,512,68
remapImageBlockDestination2 = 0,68
remapImageBlockSection2Rotation = 0




useBlur = False
blurXOffset = 0
blurYOffset = 0
blurSectionWidth = 448
blurSectionHeight = 192
sectionBlurRadius = 1

useFilters = False

# ################################################### #
# hatching hashing lines

[hatchingmarks]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

function = hashlines2

xOffset = 2
colInterval = 60
colIntervalRange = 1,60
colAdj = 1

yOffset = 7
rowInterval = 1
rowIntervalRange = 10,60
rowAdj = 4

uniformRatio = False
squareRatio = False

drawingWidth = 512
drawingHeight = 64

changeLinesProb = .003
lightModeProb = .1
vertLineChange = 0.2
horizLineChange = 0.3
changeBGProb = 0.003

noiseAmplitude = 2
noiseAmplitudeRange = 1.8,4

# smoothness + speed - higher is smoother
frames = 8
scrollRate = 0

line_minHue = 0
line_maxHue = 60
line_minSaturation = .0
line_maxSaturation = .90
line_minValue = .0
line_maxValue = 1.0
line_alpha = 180

bg_minHue = 355
bg_maxHue = 60
bg_minSaturation = 0
bg_maxSaturation = 0.9
bg_minValue = .0
bg_maxValue = .9
bg_alpha = 40




[diag]
#---------------------------------#

fontColor = 255,255,0
outlineColor = 255,0,0
fontColor2 = 0,0,100
bgColor = 0,0,254
showGrid = True
fontSize = 14

brightness =  .2
outerColor = 10,0,100
innerColor = 230,40,0
borderColor = 10,0,0

