[displayconfig]
# prostrate at the alter of the grid .... ;)
#--------------------- #
work = informal-lines
; work = diagnostics
#--------------------- #

rotation = 0
checkForConfigChanges = False
doFullReloadOnChange = False

tileSizeHeight = 64
tileSizeWidth = 64

rows = 5
cols = 6

# ---  Also determines the window geometry
screenWidth = 256
screenHeight = 320

# ---  preparing for rotation
windowWidth = 256
windowHeight = 320

canvasWidth = 256
canvasHeight = 320

imageXOffset = 0
imageYOffset = 0

# - for small adjustments when sending to 
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 150
windowYOffset = 150

brightness =  .95
minBrightness = 0

usePixelSort = False
pixelSortRotatesWithImage = True
pixSortDirection = lateral
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = -2
pixSortboxHeight = 2
pixSortboxWidth = 384
pixSortgap = 0
pixSortprobDraw = .025
pixSortprobGetNextColor = .9
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 2
pixSortDrawVariance = 1
randomColorProbabilty = .1
brightnessVarLow = .99
brightnessVarHi = 1.0
pixelSortAppearanceProb = .99


## This is re-used by the dither filter
## to set the patch affected
remapImageBlock = False		
remapImageBlockSection = 0,0,256,384
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0

remapImageBlock3 = False
remapImageBlockSection3 = 64,225,128,256
remapImageBlockDestination3 = 384,128
remapImageBlockSection3Rotation = 0

remapImageBlock4 = False
remapImageBlockSection4 = 0,0,192,384
remapImageBlockDestination4 = 0,0
remapImageBlockSection4Rotation = .18


useBlur = False
blurXOffset = 0
blurYOffset = 0
blurSectionWidth = 448
blurSectionHeight = 192
sectionBlurRadius = 1

useFilters = False


[informalMarksGrid]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 260
drawingHeight = 320

# more loops and tangles
backTrackRange = 1,10

renderLinesAsEnvelope = True

xOffset = 8
pointsPerLineCol = 8

#---------------------------------#
yOffset = 8
noiseAmplitudeRangeCol = .1,1.210
angleRange = 10,60
angleAltRange = -12,12
sizeRange = 5
vertLineWidthRange = 0,2

colIntervalRange = 14,14
rowIntervalRange = 9,9
markMinWidth = 16
markMinHeight = 40
minXSpacing = 2
minYSpacing = 36

skipMarksProb = .25
altMarksProb = .610
marksAltColorProb = .02

#---------------------------------#
scribbleSkipMarksProb = .61
scribbleAltMarksProb = .00

scribblexOffset = 20
scribbleyOffset = 10
scibbleXPacking = 3.1
scibbleYPacking = 2.4

scribbleHeightRange = 4,5
scribbleLineBaseWidthRange = 5

scribbleRadiusXRange = 4,8
scribbleRadiusYRange = 8,12

scribblePoints = 10
scribbleLoopsRange = 2,3

scribbleNoiseXRange = 5,5
scribbleNoiseYRange = 1,2

scribbleRows = 11
scribbleCols = 18

scribbleAltColorProb = .03

#---------------------------------#
# chance per frame any line drawing character changes
changeLinesProb = .01
# chance per frame the overall drawing character changes
changeAllLinesProb = .0005
# chance that the background changes
changeBGProb = 0.003


lightMode = True
lightModeProb = .65
lightLinesOnGroundProb = .0
lightLinesOnGround = False

pauseProb = .0002
unpauseProb = .003


#---------------------  bgparameters]

# when going full black/white return to base at this per cycle
bg_alpha_returnrate = 10
paletteSets = palette_pinks,palette_all_on_naples,palette_aging

# chance that an overlay block is drawn
usebgBoxProb = .01
forceBgBox = False
useBgBox = False
clearbgBoxprob = .0003
bgBoxBox = 0,0,256,256

bgTileSizeWidthMin = 64
bgTileSizeHeightMin = 64
bgTileSizeWidthMax = 128
bgTileSizeHeightMax = 129

bgGlitchCyclesMin = 4
bgGlitchCyclesMax = 30
bgGlitchDisplacementHorizontal = 10
bgGlitchDisplacementVertical = 10

initialRunsOfBgBlocks = 30



