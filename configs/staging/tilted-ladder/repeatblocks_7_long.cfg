faderLargeBlockYSections  = 2

faderSmallBlockXSections  = 32
faderSmallBlockYSections  = 64

sectionDeltaWidth = 20
sectionDeltaHeight = 5

faderParallelBlocks = 5


#--------------------- filterRemapping  ------------------

filterRemapping = True
filterRemappingProb = .002
filterRemapMinHoriSize = 128
filterRemapMaxHoriSize = 256
filterRemapMinVertSize = 3
filterRemapMaxVertSize = 48
filterRemapRangeX = 1000
filterRemapRangeY = 64

contractXSpeed = 20
contractYSpeed = 20
expandXSpeed = 50
expandYSpeed = 20


#--------------------- DISTURBANCES  ---------------------
sectionDisturbance = True
