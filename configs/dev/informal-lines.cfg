[displayconfig]
# prostrate at the alter of the grid .... ;)
work = informal-lines
; work = diagnostics

rotation = 0
checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 64
tileSizeWidth = 64

rows = 5
cols = 6

# ---  Also determines the window geometry
screenWidth = 512
screenHeight = 224

# ---  preparing for rotation
windowWidth = 512
windowHeight = 224

canvasWidth = 512
canvasHeight = 224

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2647
windowYOffset = 118


; # Window Offset
; windowXOffset = 15
; windowYOffset = 15

brightness =  .95
minBrightness = 0

usePixelSort = False
pixelSortRotatesWithImage = True
pixSortDirection = lateral
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = -2
pixSortboxHeight = 2
pixSortboxWidth = 384
pixSortgap = 0
pixSortprobDraw = .025
pixSortprobGetNextColor = .9
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 2
pixSortDrawVariance = 1
randomColorProbabilty = .1
brightnessVarLow = .99
brightnessVarHi = 1.0
pixelSortAppearanceProb = .99


## This is re-used by the dither filter
## to set the patch affected
remapImageBlock = False		
remapImageBlockSection = 0,0,512,224
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0

remapImageBlock3 = False
remapImageBlockSection3 = 64,225,128,256
remapImageBlockDestination3 = 384,128
remapImageBlockSection3Rotation = 0

remapImageBlock4 = False
remapImageBlockSection4 = 0,0,192,384
remapImageBlockDestination4 = 0,0
remapImageBlockSection4Rotation = .18


useBlur = False
blurXOffset = 0
blurYOffset = 0
blurSectionWidth = 448
blurSectionHeight = 192
sectionBlurRadius = 1

useFilters = False


[hatchingmarks]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 800
drawingHeight = 230


# more loops and tangles
tangleProb = 1.0
backTrackRange = 1,10

# grid single-lines
drawingShape = grid
renderLinesAsEnvelope = True

; imageXPOSSpeed = .1

# these really control the feel of
# activity - frenetic grid, soft undulations
# sense of randomness on or through the grid
# @todo make into mode sets

xOffset = 8
pointsPerLineCol = 8
colAdj = 1
colFirst = True


; verticalMovement = True
; verticalMovementProb = .2
; vertLineChangeRange = .01,.02
; vertLineSpeedRange = 1,1

; pointsPerLineRow = 8
; rowAdj = 1
; horizontalMovement = True
; noiseAmplitudeRangeRow = .1,3.0
; horizontalMovementProb = 0.002
; horizLineChangeRange = .1,.2
; horizLineSpeedRange = 1,5
; horizBaseWidthRange = 0,2



#---------------------------------#
yOffset = 8
noiseAmplitudeRangeCol = .1,1.210
angleRange = 10,60
angleAltRange = -12,12
sizeRange = 5
vertLineWidthRange = 0,2

colIntervalRange = 39,39
rowIntervalRange = 6,6
markMinWidth = 16
markMinHeight = 40
minXSpacing = 2
minYSpacing = 36

skipMarksProb = .25
altMarksProb = .610
marksAltColorProb = .02

#---------------------------------#
scribbleSkipMarksProb = .61
scribbleAltMarksProb = .00

scribblexOffset = 20
scribbleyOffset = 10
scibbleXPacking = 3.1
scibbleYPacking = 2.4


scribbleHeightRange = 4,5
scribbleLineBaseWidthRange = 5

scribbleRadiusXRange = 4,8
scribbleRadiusYRange = 8,12

scribblePoints = 10
scribbleLoopsRange = 2,3

scribbleNoiseXRange = 5,5
scribbleNoiseYRange = 1,2

scribbleRows = 11
scribbleCols = 18

scribbleAltColorProb = .03

#---------------------------------#
uniformRatio = False
squareRatio = False

useSingleMode = False
# these only need to be set for singleMode
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 10
# line_alpha = 180

# chance per frame any line drawing character changes
changeLinesProb = .01
# chance per frame the overall drawing character changes
changeAllLinesProb = .002
# chance that the background changes
changeBGProb = 0.003


lightMode = True
lightModeProb = .85
lightLinesOnGroundProb = .0
lightLinesOnGround = False

pauseProb = .0002
unpauseProb = .003

# when going full black/white return to base at this per cycle
bg_alpha_returnrate = 10




#-------------------------------------------------------
#----- for blanks_and_dither_remapping module ----------
#-------------------------------------------------------

#---------------------  blanks blocks ------------------
useBlanks = False
resetBlanksProb = .0004
numberOfDeadPixels = 2
blankColorAsColorProb = .0
sizeTarget = 250,300
colsRange = 64,96
rowsRange = 90,128
blankPolyVariation = 2


#--------------------- filterRemapping  ------------------

filterRemapping = False
filterRemappingProb = .002
filterRemapMinHoriSize = 12
filterRemapMaxHoriSize = 256
filterRemapMinVertSize = 3
filterRemapMaxVertSize = 16
filterRemapRangeX = 250
filterRemapRangeY = 320

contractXSpeed = 10
contractYSpeed = 10
expandXSpeed = 10
expandYSpeed = 10

#----- adding panel modulation to mimic physical panel differences
usingPanelOverlays = False
panelColumns = 0
panelRows = 0
panelWidth = 64
panelHeight = 64
panelOverlayRange = 5,10
panelOverlayChangeProb = .001
panelOverlayAmount = .11


#---------------------  bgparameters]

paletteSets = palette_pinks,palette_all_on_naples,palette_aging

drawMoire = True
drawMoireProb = .01
drawMoireProbOff = .08

moireXPos  = 160
moireYPos  = 110
moireXDistance = 10
moireYDistance = 10

setMoireColor = True
moireColor = 0,140,60,50
moireColorAlt = 40,0,0,100
moireColorAltProb = .5

# chance that an overlay block is drawn
usebgBoxProb = .01
forceBgBox = False
useBgBox = False
clearbgBoxprob = .0003
bgBoxBox = 0,0,256,256

bgTileSizeWidthMin = 64
bgTileSizeHeightMin = 64
bgTileSizeWidthMax = 128
bgTileSizeHeightMax = 129

bgGlitchCyclesMin = 4
bgGlitchCyclesMax = 30
bgGlitchDisplacementHorizontal = 10
bgGlitchDisplacementVertical = 10

initialRunsOfBgBlocks = 30

