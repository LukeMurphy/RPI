[displayconfig]
# --------------------------------------------------#
work = actionmarks_v3
# work = diagnostics
# --------------------------------------------------#

rotation = 0
checkForConfigChanges = False
doFullReloadOnChange = False

tileSizeHeight = 32
tileSizeWidth = 64

rows = 8
cols = 11

# ---  Also determines the window geometry
screenWidth = 128
screenHeight = 128

# ---  preparing for rotation
windowWidth = 128
windowHeight = 128

canvasWidth = 128
canvasHeight = 128

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# # Window Offset
# windowXOffset = 2711
# windowYOffset = 118
# # Window Offset
windowXOffset = 120
windowYOffset = 120

brightness = 1.0
minBrightness = 0

imageXOffset = 0
imageYOffset = 0

remapImageBlock = False
remapImageBlockSection = 0,0,7,192
remapImageBlockDestination = 0,0

remapImageBlock2 = False
remapImageBlockSection2 = 0,96,768,128
remapImageBlockDestination2 = 384,0

remapImageBlock3 = False
remapImageBlockSection3 = 384,0,512,32
remapImageBlockDestination3 = 0,32

remapImageBlock4 = False
remapImageBlockSection4 = 512,0,768,32
remapImageBlockDestination4 = 0,64


remapImageBlockShift = False
remapImageBlockShiftSection = 0,128,64,160
remapImageBlockShiftStableSection = 0,0,256,128
remapImageBlockShiftDestination = 128,128


usePixelSort = False
pixelSortRotatesWithImage = False
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 0
pixSortboxHeight = 192
pixSortboxWidth = 1
pixSortgap = 0
pixSortprobDraw = .7
pixSortprobGetNextColor = 1
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 12
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .9
brightnessVarHi = 1.1
pixelSortAppearanceProb = .99

useBlur = False
blurXOffset = 120
blurYOffset = 120
blurSectionWidth = 90
blurSectionHeight = 20
sectionBlurRadius = 2

useFilters = True
ditherfilterbrightness = .95

# --------------------------------------------------#
[drawingField]

slotRate = .03

# change the drawing mode
changeDrawingModeTime = 20
# if this is too high, it all gets "poppy"
bgColorAlpha = 10
# chance, per cycle, move the dither around
filterremappingprob = .0002
# chance, per cycle, that overlay blocks are cleared
# not realy that useful because the composite image is
# always being added to so retains a continuous pile
# of layers
clearbgBoxprob = .0003

# chance, per cycle, that the line drawing jitters
doJitterProb = .001

# change Palette and Drawing
changeColorSetTime = 73

# the range of time is any time between (changeColorSetTime) and (changeColorSetTime X changeColorSetTimeMaxMultiplier)
# so if the base is 40 and multiplier is 3, the palette set will chang any time between 40 seconds and 120 seconds
changeColorSetTimeMaxMultiplier = 4


# # when adding background blocks also jitter drawing
doJitterWhenAddingBG = True
# rate per cycle that a new bg is blended-in
blendLevelRateBase = .001

changeBGColorProb = .001

totalRandomPenColorProb = .5
totalRandomBGBoxColorProb = .02

jitterIterationsMin = 1
jitterIterationsMax = 30
jitterIterationsHoriz = 2
jitterIterationsVert = 2
alwaysJitterLineAfterDrawn = True

penAlpha = 200

# time to clear the canvas
changeTime = 0

fadeRateNewSystemThreshold = 2.0

# this guy is presented rotated -90
# so adjusting so the horizontal dither
# banding appears a more vertically biased
filterremapping = True
filterRemapMinHorzSize = 60
filterRemapMaxHorzSize = 128
filterRemapRangeX = 128
filterRemapMinVertSize = 8
filterRemapMaxVertSize = 128
filterRemapRangeY = 128

innerRadius = 50
outerRadius = 700

usebgBox = False
usebgBoxProb = .005
bgBoxBox = 0,0,128,128
bgTileSizeWidthMin = 93
bgTileSizeWidthMax = 132
bgTileSizeHeightMin = 93
bgTileSizeHeightMax = 132

bgBoxAlphaRange = 40,248
forcebgBox = True

compositionModeChangeProb = .01

bgGlitchCyclesMin = 1
bgGlitchCyclesMax = 20
bgGlitchDisplacementHorizontal = 6
bgGlitchDisplacementVertical = 6

# --------------------------------------------------#

# ************************************************* #
# textures are in configs/asset_configs/textures
# pens and marks are in configs/asset_configs/marks
# ************************************************* #
# as defined in this file

drawingBundle = prod/landscaper-actionmarks-bundle-384px

# paletteSets = OnPink_v2
paletteSets = lyricalGrid,
            BathersWithTurtle,
            BathersWithTurtle,
            scribbles,
            rose_x_nograys,
            rose_xCurves,
            VirHeroicusSublimis_v1,
            CoastalIndustry,
            OnPink_v2,
            OnSystemBlue_v1,
            PostItNotesBlueInk2_v1,
            dekoonig_v2,
            lasttwombly


textureSets = texture1,texture2,texture3,textureScrim2,texture4
penNames =  lineMarksDashed,
            lineMarksVertBands,
            lineMarksVertNarrow,
            longOvalSweeps1,
            longOvalSweeps2,
            longOvalSweeps2b,
            shortMarks,
            shortMarks2,
            scratchyLong,
            scratchyLong2,
            spiralGyres,
            spiralGyres2,
            lineMarksH1,
            lineMarks2,
            lineMarksVert,
            lineMarksVertHeavy,
