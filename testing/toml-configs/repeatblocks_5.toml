# ---------------------------------------------------------------------
# ---------------------------------------------------------------------

[movingpattern]
# ---------------------------------------------------------------------
# ---------------------------------------------------------------------
# --------------------- COMBINATIONS  ---------------------
# problem --  when choosing some palettes or patterns need to exclude certain
# combinations as they don't work out so well
# so when choosing a palette then choosing a pattern, check the exclusion list
# and vis a versa
combinationsets = "comboSet6,comboSet4,comboSet1,comboSet2,comboSet3,comboSet5,comboSet0"
# checked every cycle, does palette change?
changecombinationanytimeprob = 0.001
setupdebug = false
# Template for other versions 02-11-2025
redrawspeed = 0.03
slotrate = 0.04
delay = 0.03
canvasrotation = -0.0
canvasoffsetx = -0.0
canvasoffsety = -0.0
imgcanvasoffsetx = 0
imgcanvasoffsety = 0
# ---------------------------------------------------------------------
useblursection = false
blursectionwidth = 120
blursectionheight = 60
mask_blur_amt = 20
cp_blur_amt = 3
blursectionxpos = 220
blursectionypos = 0
usepixelsortrandomize = false
# -------------------- transitions and fading in/out -------------------
faderdoingrefreshcount = 30
# --------------------- filterRemapping  ------------------
filterremapping = true
filterremappingprob = 0.005
filterremapminhorisize = 32
filterremapminvertsize = 32
filterremapmaxhorisize = 256
filterremapmaxvertsize = 256
filterremaprangex = 512
filterremaprangey = 220
# --------------------- DISTURBANCES  ---------------------
sectiondisturbance = true
disturbanceconfigsets = "medium"
# disturbanceConfigSets = minimal
changedisturbancesetprob = 0.25
stablesectionsmin = 4
stablesectionsmax = 5
stablesectionsminwidth = 32
stablesectionsminheight = 32
stablesectionschangeprob = 0.001
# --------- WAVE DISTORTIONS ------------------
usewavedistortion = true
waveamplitude = 30
waveperiodmod = 5
wavegridspace = 30
pnoisemod = 10
wavedeformxposrate = 0.003
# --------- Transform       ------------------
transformshape = false
# width skew
# vertical sheer
# haorizontal ,vertical perspective
# transformTuples = 1.0, 1.0, .0, -.0,  1.50, 2.0, 0.0, 0.002
# transformTuples = .9, .0, .0, -.0,  1.0, .91, 0.001, 0.001
transformtuples = "1.20, 0, 1.0, -.0, 1, 0.10, 0.005, 0.000"
# --------------------- PATTERNS  ---------------------
# the types of pattern
# wavePattern
# reMove -->lines move
# diagonalMove  --> block moves
# randomizer
# runningSpiral
# concentricBoxes
# runningSpiral
# diamond
# shingles
# circles
# waveScales
# fishScales
# wavePattern2
# compass
# circlesPacked
# coloredBlocks
# gothic1
# patterns = randomizer2,waveScales,fishScales,fishScales,wavePattern2,waveScales
patterns = "fishScales3,fishScales2,shellScales,tripart,circles,gothic1,randomizer2,randomizer,waveScales,waveScales,fishScales,fishScales,fishScales,wavePattern2,decoBoxes,reMove,concentricBoxes,diamond,balls,compass,compass_hili,peaceCross,littleCones,balls_hili,logcabin,logcabinAlt1,logcabinAlt2"
dominantpatterns = "peaceCross"
dominantpatternprob = 0.95
# patterns = waveScales,waveScales
# patterns = gothic1,tripart
# initial patternModel -- this is NOT used if the patterns list is specified!
patternmodel = "waveScales"
patternsequence = "waveScales,0,0"
# Border Controls
borderpattern = "compass"
useborderpattern = true
# dimensions of each pattern block
blocksizechangeprob = 0.5
blocksizechangealwaysusemax = false
blockwidthmin = 32
blockwidthmax = 80
# the higher the pattern sequence limits,
# means more changes in the patterns shown
# NOT IN USE CURRENTLY
patternsequencemin = 3
patternsequencemax = 8
# --------------------- PATTERN CHANGE   ---------------------
# higher = more variation in patterns
# e.g. .2 is 20% chance each new block will change to a
# new pattern
# ***********  IMPORTANT *****************
patternchangewhenbuilding = 0.2
# rate the patterns change - if lower, then the distortions
# are more complete - checked each cycle so
# .001 roughly is a 3% chance every second
# ***********  IMPORTANT *****************
rebuildpatternprobability = 0.001
# does a rebuild of the patterns also trigger a new palette
changepalettewhenrebuildprob = 0.001
# after a new palette is chosen, does it force an pattern rebuild
probpatternsrebuildafternewpalette = 0.7
# checked every cycle, does palette change?
changepaletteanytimeprob = 0.001
# chance that when the palette changes, it pulls
# a whole new palette from the available list
# lower means more uniform palette
changefullpalettewhenchangingpatternprob = 0.5
# when updating all the blocks with the new palette,
# chance that each one accepts the change
changeeachblockwhenchangingpatternprob = 0.95
patternmodelvariations = true
drawbgcoloreachcycle = true
# chance that the palette will draw a new color
# from the active palette when the pattern changes
# lower means more uniform palette
# a zero value prevents any palette mixing
changepalettewhenchangingpatternprob = 0.0
# --- individual pattern parameters  ---------------------
# forces the patterns to align to a certain rotation
# useful instead of rotation the whole piece etc
patternorientation = -90.0
# increases density of pattern for diamonds, balls, shingles
numrows = 2
numdotrows = 3
numrowsrandomize = false
numshinglerows = 2
shinglevariation = true
shinglevariationrange = 6
# to be nice and even, has to be even multiple of blockWidth
# if you want artifact, then anything else ;)
linediff = 2
usedoubleline = true
# decobox controls
decoboxbandwidth = 3
# waveScales controls
linesonly = false
numscalerows = 4
ringsrange = "10,18"
stepsrange = "2,3"
# for the diamond pattern
diamondstep = 1
randomizespeed = true
# for any moving pattern: diamond, reMove
xspeed = 0.8
yspeed = 0.1
# for the concentric squares
# careful with this, too many over the
# blockWidth will cause an issue....
minnumconcentricboxes = 2
maxnumconcentricboxes = 16
# for the randomizer
randomblockprob = 0.1
randomblockwidth = 3
randomblockheight = 3
# For the sine wave repeater
steps = 2
amplitude = 9
yoffset = 12
steps2 = 2
amplitude2 = 9
yoffset2 = 13
phasefactor = 4
speedfactor = 1
# --------------------- COLORS   ---------------------
# LIST ALL PALETTES THAT ARE GOING TO BE USED
