[particleSystem]
#-------------------------------------------##----------------------------------------------------#

numUnits = 590
delay = .02
slotRate = .03
restartProb = .0001

# COLOR SETTINGS
# ----------------------------------

palettes = flame-particles,flame-particles
paletteChangeProb = .001

# ----------------------------------
### If this is True, always creating just
### one unit when one goes off screen vs.
### bursting -- prevents flickering of the
### units when one gets removed and the
### drawing order changes mid-stream
fixedUnitArray = True
objColor = fixed
objTrails = False
trailingFade = 200
renderDiagnostics = False
# ----------------------------------

objWidth = 10
objHeight = 20
objType = rect

speedMin = .35
speedMax = 1.9

widthRate = .9992
heightRate = .9997

# ----------------------------------
