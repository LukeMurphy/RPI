[displayconfig]
#-----------------------------------------------#
# setup for cross beam in corner
# like a moving Fred Sanback

work = scrolling_image
# work = diagnostics
#-----------------------------------------------#

; 18 panels 64x64

rotation = 0
fullRotation = True
rotationTrailing = False

checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 64
tileSizeWidth = 64
matrixTiles = 48
rows = 2
cols = 20

# ---  Also determines the window geometry
screenWidth = 1152
screenHeight = 256

# ---  preparing for rotation
windowWidth = 1152
windowHeight = 256

canvasWidth = 1152
canvasHeight = 256

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2583
windowYOffset = 630

brightness = 1.0
minBrightness = 0


## This is re-used by the dither filter
## to set the patch affected
remapImageBlock = False		
remapImageBlockSection = 0,0,500,3
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0

remapImageBlock2 = True
remapImageBlockSection2 = 320,0,640,64
remapImageBlockDestination2 = 0,64
remapImageBlockSection2Rotation = 0

remapImageBlock3 = True
remapImageBlockSection3 = 576,0,896,64
remapImageBlockDestination3 = 0,128
remapImageBlockSection3Rotation = 0

remapImageBlock4 = True
remapImageBlockSection4 = 832,0,1152,64
remapImageBlockDestination4 = 0,192
remapImageBlockSection4Rotation = 0


usePixelSort = False
pixelSortRotatesWithImage = False
pixSortDirection = lateral
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 0
pixSortboxHeight = 1
pixSortboxWidth = 1200
pixSortgap = 0
pixSortprobDraw = 1.0
pixSortprobGetNextColor = 1
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 3
pixSortDrawVariance = 1
randomColorProbabilty = .01
brightnessVarLow = .9
brightnessVarHi = 1.1
pixelSortAppearanceProb = 1.0

useBlur = False
blurXOffset = 120
blurYOffset = 120
blurSectionWidth = 90
blurSectionHeight = 20
sectionBlurRadius = 2

useFilters = True
ditherfilterbrightness = 1.1

#-----------------------------------------------#
[scrollingImage]
#-----------------------------------------------#


redrawSpeed = .03
slotRate = .0333

# baseImage = assets/imgs/spritesheets/mile-h2.png
# baseImage = assets/imgs/spritesheets/mile-h2-70-percent.png
baseImage = assets/imgs/spritesheets/mile-h2-red.png
# baseImage = assets/imgs/spritesheets/mile-h2b.png
segmentWidth = 1152
segmentHeight = 64

xOffSet = 0
yOffSet = 0

# set to 0 or 1 to use image height
resizeHeight = 32

# this sets the desired size of drawing
# to scale up to - so 1609344mm = 1 mile
# mmSizeOfDrawing = 1000000
mmSizeOfDrawing = 1609344

# the dot-pitch of the display
mmPerPixel = 5

# the desired apparent speed
speedMPH = 3

# this is ignored if mph is set
speedX = 12
# speedKmPH = 0


# background color HSV ranges
bg_minHue = 340
bg_maxHue = 25
bg_minSaturation = .90
bg_maxSaturation = 1.0
bg_minValue = .3
bg_maxValue = .5
bg_dropHueMinValue = 0
bg_dropHueMaxValue = 0
# background color alpha 
bg_alpha = 150
# chance that the background changes
backgroundColorChangeProb = .01

# moves the dither sparkle around
filterRemapping = True
filterRemappingProb = .004
filterRemapHorizSize = 448
filterRemapVertSize = 240
filterRemapMinHorizSize = 448
filterRemapMinVertiSize = 240

filterRemapRangeX = 0
filterRemapRangeY = 60



[diag]
fontColor = 255,255,0
outlineColor = 255,0,0
fontColor2 = 0,0,100
bgColor = 0,0,254
showGrid = True
fontSize = 14

brightness =  .2
outerColor = 10,0,100
innerColor = 230,40,0
borderColor = 10,0,0
