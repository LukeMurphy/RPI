[displayconfig]
#---------------------------------#
work = informal-marks
#work = diagnostics
#---------------------------------#

rotation = 0
checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 86
tileSizeWidth = 172
matrixTiles = 48
rows = 8
cols = 8

# ---  Also determines the window geometry
screenWidth = 256
screenHeight = 240

# ---  preparing for rotation
windowWidth = 256
windowHeight = 240

canvasWidth = 256
canvasHeight = 240

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
; windowXOffset = 2711
; windowYOffset = 87

windowXOffset = 179
windowYOffset = 60

brightness = 1.1
minBrightness = 0


remapImageBlock = False
remapImageBlockSection = 0,0,100,40
remapImageBlockDestination = 0,0
# remapImageBlockSectionRotation = 0

remapImageBlockShift = False
remapImageBlockShiftSection = 0,0,188,86
remapImageBlockShiftStableSection = 0,0,0,0
remapImageBlockShiftDestination = -8,0

remapImageBlockShift2 = False
remapImageBlockShiftSection2 = 0,86,180,172
remapImageBlockShiftStableSection2 = 0,0,0,0
remapImageBlockShiftDestination2 = 0,86



usePixelSort = False
pixelSortRotatesWithImage = False
pixSortDirection = lateral
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = -2
pixSortboxHeight = 1
pixSortboxWidth = 195
pixSortgap = 0
pixSortprobDraw = .02
pixSortprobGetNextColor = 1
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 12
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .9
brightnessVarHi = 1.1
pixelSortAppearanceProb = .99

useBlur = False
blurXOffset = 120
blurYOffset = 120
blurSectionWidth = 90
blurSectionHeight = 20
sectionBlurRadius = 2

useFilters = False
ditherfilterbrightness = 1.1

[informalMarksGrid]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 260
drawingHeight = 384


# more loops and tangles
backTrackRange = 1,10

renderLinesAsEnvelope = True

xOffset = 8
pointsPerLineCol = 8

#---------------------------------#
yOffset = 8
noiseAmplitudeRangeCol = .1,1.210
angleRange = 10,60
angleAltRange = -12,12
sizeRange = 5
vertLineWidthRange = 0,2

colIntervalRange = 39,39
rowIntervalRange = 16,16
markMinWidth = 16
markMinHeight = 40
minXSpacing = 2
minYSpacing = 36

skipMarksProb = .25
altMarksProb = .610
marksAltColorProb = .2

#---------------------------------#
scribbleSkipMarksProb = .15
scribbleAltMarksProb = .00

scribbleCols = 12
scribbleRows = 10

scribblexOffset = 20
scribbleyOffset = 30
scibbleXPacking = 2.1
scibbleYPacking = 2.1

scribbleHeightRange = 4,5
scribbleLineBaseWidthRange = 4

scribbleRadiusXRange = 4,18
scribbleRadiusYRange = 8,22

scribblePoints = 20
scribbleLoopsRange = 2,4

scribbleNoiseXRange = 8,8
scribbleNoiseYRange = 3,4

scribbleAltColorProb = .3

#---------------------------------#

# chance per frame any line drawing character changes
changeLinesProb = .01
# chance per frame the overall drawing character changes
changeAllLinesProb = .001
# chance that the background changes
changeBGProb = 0.001


lightMode = False
lightModeProb = .0
lightLinesOnGroundProb = .0
lightLinesOnGround = False

pauseProb = .0002
unpauseProb = .03

#---------------------  bgparameters]

scribbleOnTop = False
singlesOnTop = True
xsOnTop = False

# when going full black/white return to base at this per cycle
bg_alpha_returnrate = 10

paletteSets =  palette_orange,palette_pinks
; palette_pinks,palette_all_on_naples,palette_aging

# chance that an overlay block is drawn
usebgBoxProb = .002
forceBgBox = True
clearbgBoxprob = .001
bgBoxBox = 0,0,128,128

bgTileSizeWidthMin = 64
bgTileSizeHeightMin = 64
bgTileSizeWidthMax = 128
bgTileSizeHeightMax = 129

bgGlitchCyclesMin = 4
bgGlitchCyclesMax = 30
bgGlitchDisplacementHorizontal = 10
bgGlitchDisplacementVertical = 10

initialRunsOfBgBlocks = 30



