[displayconfig]
# prostrate at the alter of the grid .... ;)
work = hashing-v3
# work = diagnostics

rotation = 0
checkForConfigChanges = False
doFullReloadOnChange = False

tileSizeHeight = 32
tileSizeWidth = 64

rows = 8
cols = 11

# ---  Also determines the window geometry
screenWidth = 192
screenHeight = 256

# ---  preparing for rotation
windowWidth = 192
windowHeight = 256

canvasWidth = 192
canvasHeight = 256

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3


# Window Offset
# windowXOffset = 2110
windowXOffset = 110
windowYOffset = 55


brightness = 1.0
minBrightness = 0

imageXOffset = 0
imageYOffset = 0

remapImageBlock = False
remapImageBlockSection = 0,0,12,220
remapImageBlockDestination = 0,0

remapImageBlock2 = False
remapImageBlockSection2 = 0,96,258,258
remapImageBlockDestination2 = 384,0

remapImageBlock3 = False
remapImageBlockSection3 = 384,0,512,32
remapImageBlockDestination3 = 0,32

remapImageBlock4 = False
remapImageBlockSection4 = 512,0,768,32
remapImageBlockDestination4 = 0,64


remapImageBlockShift = False
remapImageBlockShiftSection = 0,128,268,224
remapImageBlockShiftStableSection = 0,0,268,128
remapImageBlockShiftDestination = 38,128

usePixelSort = False
pixelSortRotatesWithImage = False
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 0
pixSortboxHeight = 192
pixSortboxWidth = 1
pixSortgap = 0
pixSortprobDraw = .7
pixSortprobGetNextColor = 1
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 12
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .9
brightnessVarHi = 1.1
pixelSortAppearanceProb = .99

useBlur = False
blurXOffset = 120
blurYOffset = 120
blurSectionWidth = 90
blurSectionHeight = 20
sectionBlurRadius = 2

useFilters = False
ditherfilterbrightness = .95

# ################################################### #
# hatching hashing lines

[hatchingmarks]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 192
drawingHeight = 256


# more loops and tangles
tangleProb = 1.0
backTrackRange = 1,10

# grid single-lines
drawingShape = grid
renderLinesAsEnvelope = True

; imageXPOSSpeed = .1

# these really control the feel of
# activity - frenetic grid, soft undulations
# sense of randomness on or through the grid
# @todo make into mode sets

xOffset = 8
pointsPerLineCol = 28
colAdj = 1
colFirst = True
noiseAmplitudeRangeCol = 1.1,4.0
colIntervalRange = 20,80
verticalMovement = True
verticalMovementProb = .002
vertLineChangeRange = .001,.02
vertLineSpeedRange = 1,3
vertBaseWidthRange = 0,0

yOffset = 8
pointsPerLineRow = 28
rowAdj = 1
rowIntervalRange = 20,80
horizontalMovement = True
noiseAmplitudeRangeRow = 1.1,4.0
horizontalMovementProb = 0.0020
horizLineChangeRange = .001,.002
horizLineSpeedRange = 1,3
horizBaseWidthRange = 0,0

uniformRatio = False
squareRatio = False

useSingleMode = False
# these only need to be set for singleMode
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 10
# line_alpha = 180

# chance per frame the overall drawing character changes
changeLinesProb = .0004
changeBGProb = 0.0003

lightMode = False
lightModeProb = .0
lightLinesOnGroundProb = .0
lightLinesOnGround = False


pauseProb = .0002
unpauseProb = .003


# when going full black/white return to base at this per cycle
bg_alpha_returnrate = .2

line_minHue = 0
line_maxHue = 60
line_minSaturation = .5
line_maxSaturation = .50
line_minValue = .05
line_maxValue = .10
line_minDropHue = 0
line_maxDropHue = 0
line_alpha_range = 18,30

line_mid_minHue = 355
line_mid_maxHue = 60
line_mid_minSaturation = .45
line_mid_maxSaturation = .55
line_mid_minValue = .5
line_mid_maxValue = .6
line_mid_minDropHue = 0
line_mid_maxDropHue = 0
line_mid_alpha_range = 180,230


line_light_minHue = 40
line_light_maxHue = 50
line_light_minSaturation = .5
line_light_maxSaturation = .50
line_light_minValue = .65
line_light_maxValue = 1.0
line_light_minDropHue = 0
line_light_maxDropHue = 0
line_light_alpha_range = 180,230

bg_minHue = 355
bg_maxHue = 60
bg_minSaturation = 0.2
bg_maxSaturation = 0.5
bg_minValue = .6
bg_maxValue = .6
bg_dropHueMin = 11
bg_dropHueMax = 50
bg_alpha_range = 20,140

bgSets = 34,50,.2,.99,.9,.9|355,10,.1,.4,.9,.9

#---------------------  blanks blocks
resetBlanksProb = .0002
numberOfDeadPixels = 3
blankColorAsColorProb = .0
sizeTarget = 190,250
colsRange = 32,128
rowsRange = 32,128
blankPolyVariation = 2


#--------------------- filterRemapping  ------------------

filterRemapping = False
filterRemappingProb = .002
filterRemapMinHoriSize = 12
filterRemapMaxHoriSize = 256
filterRemapMinVertSize = 3
filterRemapMaxVertSize = 16
filterRemapRangeX = 384
filterRemapRangeY = 320

contractXSpeed = 10
contractYSpeed = 10
expandXSpeed = 10
expandYSpeed = 10

#---------------------  adding panel modulation to mimic physical panel differences
panelColumns = 0
panelRows = 0
panelWidth = 64
panelHeight = 64
panelOverlayRange = 5,10
panelOverlayChangeProb = .001
panelOverlayAmount = .11


[bgparameters]
drawMoire = True
drawMoireProb = .01
drawMoireProbOff = .08

moireXPos  = 160
moireYPos  = 110
moireXDistance = 10
moireYDistance = 10

setMoireColor = True
moireColor = 0,140,60,50
moireColorAlt = 40,0,0,100
moireColorAltProb = .5

# chance that an overlay block is drawn
usebgBoxProb = .01
clearbgBoxprob = .0003
bgBoxBox = 0,0,256,256

bgTileSizeWidthMin = 64
bgTileSizeHeightMin = 64
bgTileSizeWidthMax = 128
bgTileSizeHeightMax = 129

bgBoxColorRanges = 345,10,.50,1.0,.2,1.0,0,0|180,66,.750,1.0,.2,1.0,0,0|34,48,.750,1.0,.62,1.0,0,0
bgBoxAlphaRange = 40,248
forcebgBox = True

bgGlitchCyclesMin = 4
bgGlitchCyclesMax = 30
bgGlitchDisplacementHorizontal = 10
bgGlitchDisplacementVertical = 10


# chance that the background changes
backgroundColorChangeProb = .005

initialRunsOfBgBlocks = 30


