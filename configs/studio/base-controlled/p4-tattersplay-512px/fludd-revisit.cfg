[displayconfig]
# --------------------------------------------------#
; work = squares
work = fludd_2
; work = stroop2
; work = dicefactory
;work = diagnostics
# --------------------------------------------------#
# --------------------------------------------------#

checkForConfigChanges = True
doFullReloadOnChange = True

rotation = 0
fullRotation = True
rotationTrailing = False


tileSizeHeight = 32
tileSizeWidth = 64
matrixTiles = 48
rows = 7
cols = 9

# ---  Also determines the window geometry
screenWidth = 576
screenHeight = 256

# ---  preparing for rotation
windowWidth = 576
windowHeight = 256

canvasWidth = 576
canvasHeight = 256

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# ----------------------------------------------------------- #

# Window Offset
windowXOffset = 2647
windowYOffset = 118

# ----------------------------------------------------------- #

brightness = 1.0
minBrightness = 0

useFilters = False
ditherfilterbrightness = 1.1

# ----------------------------------------------------------- #

remapImageBlock = False
remapImageBlockSection = 0,0,64,384
remapImageBlockDestination = 0,0
remapImageBlockSectionRotation = 0

remapImageBlock2 = False
remapImageBlockSection2 = 0,220,160,256
remapImageBlockDestination2 = 1,220
remapImageBlockSection2Rotation = 1

remapImageBlock3 = False
remapImageBlockSection3 = 224,0,256,384
remapImageBlockDestination3 = 0,0
remapImageBlockSection3Rotation = 0

# ----------------------------------------------------------- #

remapImageBlockShift = True
remapImageBlockShiftSection = 256,0,512,128
remapImageBlockShiftStableSection = 0,0,576,256
remapImageBlockShiftDestination = 320,0

# ----------------------------------------------------------- #



[fludd]
#-----------------------------------------------#

refreshRate = .02

# starting animation rate
initialAnimationRate = .03
# destination rate
animationRate = .03
# rate at which the animation-rate changes
progressiveRateVar = .01
# the amount the animation-rate changes each time
animationRateDelta = -.005

figureCols = 28
figureRows = 12

# the intitial about of rectangle side variation
initialVar = 3
varianceRange = 3,12
# The rate the variatiion changes in seconds
# the destination variation amount
finalVar = 96
progressiveVar = .2
# the amount the variation changes each time
varDelta = 0
# the number of beats it stays before starting over
# -1 means it does not repeat
varRepeatCount = 120
varRepeatCountInitial = 0


# the number of beats it stays before starting over
# -1 means it does not repeat
animationChangeRepeatCountInitial = -1
animationChangeRepeatCount = 333


# prism or plenum
# prism is all colors all at once, = no color
# plenum is all white, = all color = no color
borderModel = prism

# nothing or void
# nothing is white nothing with nothing border implied
# void is black nothing implied
nothing = void

# varianceMode = symmetrical, asymmetrical, independent
varianceMode = independent

# if demoMode == 0, no rotation of variants
# demoMode > 0 is seconds/variant
demoMode = 0


# Affects the way the implied edges fade
# lower is smoother, but maybe less interesting
blackOpacity = 20
bgOpacity = 20

# The probablility that the gray level
# will change - note checked every cycle
# so if redraw speed is .01 1/100 of a second
# and prob = .02 the probablity that it will
# change is .02/.01 x100 = 20% per second
nothingChangeProbability = .005
blacknessChangeProbability = 0

borderChangeProb = .5

; the cadence that the piece checks if the figure should change and 
; the next check time reset
figureChangeTime = 31
figureChangeProbability = 1.0
colorChangeProbability = .990
changeOnlyColor = True



[squares]
#-----------------------------------------------#
forceHoldDivision = -1
lineWidth = 1
countLimit = 2
pulseSpeed = .02
pasteDelay = .06
mode = cols



[dicefactory]
#-----------------------------------------------#
forceHoldDivision = -1
lineWidth = 1
countLimit = 2
pulseSpeed = .09
pasteDelay = .03
mode = cols

rows = 11
cols = 16
b = 0
w = 32
dibit = 4
reDrawProb = .009985
reRollProb = .51
deltaLim = .1
alwaysRedrawAfterReRoll = True
allChange = True





[stroop]
#-----------------------------------------------#
fontSize = 84
vOffset = -10
scrollSpeed = .03
stroopSpeed = .02
speedMultiplier = 2
revealSpeedMin = 1
revealSpeedMax = 3
stroopSteps = 2
shadowSize = 2
stroopFontSize = 30
useColorFlicker = 0
highervariability = True
verticalBg =  False
displayRows = 6
displayCols = 6
simulBlocks = 3
## options are reveal, revealmove, move
movementMode = reveal
moveProbability = .15
colorProbabilityReturn = .08
colorProbability = .015


[diag]
#-----------------------------------------------#
fontColor = 255,0,0
fontColor2 = 0,0,254
outlineColor = 125,125,125
bgColor = 0,0,0
showGrid = True
fontSize = 14







