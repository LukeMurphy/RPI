[displayconfig]
##########################################################

work = hashing-v3
; work = diagnostics

rotation = 0
checkForConfigChanges = False
doFullReloadOnChange = False

tileSizeHeight = 64
tileSizeWidth = 64
matrixTiles = 48
rows = 8
cols = 8

# ---  Also determines the window geometry
screenWidth = 212
screenHeight = 212

# ---  preparing for rotation
windowWidth = 212
windowHeight = 212

canvasWidth = 212
canvasHeight = 212

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
# windowXOffset = 2647
# moved back 19 px
windowXOffset = 200
windowYOffset = 201

brightness = .75
minBrightness = 0


remapImageBlock = False
remapImageBlockSection = 0,0,100,10
remapImageBlockDestination = 0,0
