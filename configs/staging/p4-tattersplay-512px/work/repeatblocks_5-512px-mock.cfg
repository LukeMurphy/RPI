#--------------------- PATTERNS  ---------------------
# fishScales3,fishScales2,shellScales,tripart,circles,colorGrid,colorGridTriangles,gothic1,randomizer2,randomizer,waveScales,waveScales,fishScales,fishScales,fishScales,wavePattern2,decoBoxes,reMove,concentricBoxes,diamond,balls,compass,compass_hili,peaceCross,littleCones,balls_hili,logcabin,logcabinAlt1,logcabinAlt2


# dimensions of each pattern block
blockSizeChangeProb = .5
blockSizeChangeAlwaysUseMax = False
blockWidthMin = 32
blockWidthMax = 80

# the higher the pattern sequence limits,
# means more changes in the patterns shown
# NOT IN USE CURRENTLY
patternSequenceMin = 3
patternSequenceMax = 8

#--------------------- PATTERN CHANGE   ---------------------
# higher = more variation in patterns
# e.g. .2 is 20% chance each new block will change to a
# new pattern
patternChangeWhenBuilding = .92

# ***********  IMPORTANT **********************************
# rate the patterns change - if lower, then the distortions
# are more complete - checked each cycle so
# .001 roughly is a 3% chance every second
rebuildPatternProbability = 0.0002

# checked every cycle, does combination set change?
changeCombinationAnytimeProb = .0008

# checked every cycle, does palette change?
changePaletteAnytimeProb = .002
# ***********  IMPORTANT **********************************


# does a rebuild of the patterns also trigger a new palette
changePaletteWhenRebuildProb = .0005

# after a new palette is chosen, does it force an pattern rebuild
probPatternsRebuildAfterNewPalette = .99

# chance that when the palette changes, it pulls
# a whole new palette from the available list
# lower means more uniform palette
changeFullPaletteWhenChangingPatternProb = 0.50

# when updating all the blocks with the new palette,
# chance that each one accepts the change
changeEachblockWhenChangingPatternProb = 0.950

patternModelVariations = True
drawbgcolorEachCycle = True

# chance that the palette will draw a new color
# from the active palette when the pattern changes
# lower means more uniform palette
# a zero value prevents any palette mixing
changePaletteWhenChangingPatternProb = 0.0


#--- individual pattern parameters  ---------------------
# forces the patterns to align to a certain rotation
# useful instead of rotation the whole piece etc
patternOrientation = -90

# increases density of pattern for diamonds, balls, shingles
numRows = 2
numDotRows = 3
numRowsRandomize = False
numShingleRows = 2

shingleVariation = True
shingleVariationRange = 6

# to be nice and even, has to be even multiple of blockWidth
# if you want artifact, then anything else ;)
lineDiff = 2
useDoubleLine = True

# decobox controls
decoboxbandwidth = 3

#waveScales controls
linesOnly = False
numScaleRows = 4
ringsRange = 10,18
stepsRange = 2,3

# for the diamond pattern
diamondStep = 1
randomizeSpeed = True

# for any moving pattern: diamond, reMove
xSpeed = .8
ySpeed = .1

# for the concentric squares
# careful with this, too many over the
# blockWidth will cause an issue....
minnumConcentricBoxes = 2
maxnumConcentricBoxes = 16

# for the randomizer
randomBlockProb = .1
randomBlockWidth = 3
randomBlockHeight = 3

# For the sine wave repeater
steps = 2
amplitude = 9
yOffset = 12

steps2 = 2
amplitude2 = 9
yOffset2 = 13
phaseFactor = 4
speedFactor = 1




