[displayconfig]
#----------------------------------------------------#
work = moving_lines
# work = diagnostics
#----------------------------------------------------#

rotation = -90
checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 64
tileSizeWidth = 64

rows = 5
cols = 6

# ---  Also determines the window geometry
screenWidth = 384
screenHeight = 384

# ---  preparing for rotation
windowWidth = 384
windowHeight = 384

canvasWidth = 384
canvasHeight = 384

imageXOffset = 0
imageYOffset = 0

# - for small adjustments when sending to 
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2910
windowYOffset = 253


# windowXOffset = 1583
# windowYOffset = 114


# windowXOffset = 1110
# windowYOffset = 600


brightness =  1.0
minBrightness = 0

usePixelSort = True
pixelSortRotatesWithImage = True
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 100
pixSortYOffset = -2
pixSortboxHeight = 384
pixSortboxWidth = 50
pixSortgap = 0
pixSortprobDraw = .03
pixSortprobGetNextColor = .19
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 2
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .99
brightnessVarHi = 1.0
pixelSortAppearanceProb = .99


## This is re-used by the dither filter
## to set the patch affected
remapImageBlock = False		
remapImageBlockSection = 0,0,256,384
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0

remapImageBlock3 = False
remapImageBlockSection3 = 64,225,128,256
remapImageBlockDestination3 = 384,128
remapImageBlockSection3Rotation = 0

remapImageBlock4 = False
remapImageBlockSection4 = 0,0,192,384
remapImageBlockDestination4 = 0,0
remapImageBlockSection4Rotation = .18


useBlur = False
blurXOffset = 0
blurYOffset = 0
blurSectionWidth = 448
blurSectionHeight = 192
sectionBlurRadius = 1

useFilters = False

# ################################################### #
# hatching hashing lines

[hatchingmarks]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 14
curveResolution = 40

noiseAmplitude = 2
noiseAmplitudeRange = 4.1,10.0
drawingHeightRange = 160,300
flameSpeedRange = 8,30
baseWidthRange = 40,140
ratioFactorRange = .6,1.9
numberOfFlameLines = 16
xOffset = 0
yOffset = -10
distributionRange = 140
verticalMovement = True
verticalMovementProb = .99
vertLineChangeRange = .001,.02

# chance per frame the overall drawing character changes
changeLinesProb = .04
changeBGProb = 0.001

pauseProb = .0002
unpauseProb = .003

bg_alpha_range = 220,240
line_alpha_range = 18,230

line_minHue = 0
line_maxHue = 60
line_minSaturation = .0
line_maxSaturation = .90
line_minValue = .0
line_maxValue = 1.0

bg_minHue = 355
bg_maxHue = 60
bg_minSaturation = 0.01
bg_maxSaturation = 0.1
bg_minValue = .01
bg_maxValue = .1
bg_dropHueMin = 11
bg_dropHueMax = 50




[diag]
#---------------------------------#

fontColor = 255,255,0
outlineColor = 255,0,0
fontColor2 = 0,0,100
bgColor = 0,0,254
showGrid = True
fontSize = 14

brightness =  .2
outerColor = 10,0,100
innerColor = 230,40,0
