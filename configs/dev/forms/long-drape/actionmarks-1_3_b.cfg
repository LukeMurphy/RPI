[displayconfig]
# --------------------------------------------------#
work = actionmarks_1_3
# work = diagnostics
# --------------------------------------------------#

rotation = 0
checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 32
tileSizeWidth = 64

rows = 8
cols = 11

# ---  Also determines the window geometry
screenWidth = 512
screenHeight = 256

# ---  preparing for rotation
windowWidth = 512
windowHeight = 256

canvasWidth = 512
canvasHeight = 256


# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2647
windowYOffset = 236

brightness = 1.0
minBrightness = 0

imageXOffset = 0
imageYOffset = 0

remapImageBlock = False
remapImageBlockSection = 0,0,32,22
remapImageBlockDestination = 0,0

remapImageBlock2 = False
remapImageBlockSection2 = 0,96,768,128
remapImageBlockDestination2 = 384,0

remapImageBlock3 = False
remapImageBlockSection3 = 384,0,512,32
remapImageBlockDestination3 = 0,32

remapImageBlock4 = False
remapImageBlockSection4 = 512,0,768,32
remapImageBlockDestination4 = 0,64


remapImageBlockShift = False
remapImageBlockShiftSection = 0,128,268,256
remapImageBlockShiftStableSection = 0,0,268,128
remapImageBlockShiftDestination = 38,128


usePixelSort = False
pixelSortRotatesWithImage = False
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 0
pixSortboxHeight = 192
pixSortboxWidth = 1
pixSortgap = 0
pixSortprobDraw = .7
pixSortprobGetNextColor = 1
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 12
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .9
brightnessVarHi = 1.1
pixelSortAppearanceProb = .99

useBlur = False
blurXOffset = 120
blurYOffset = 120
blurSectionWidth = 90
blurSectionHeight = 20
sectionBlurRadius = 2

useFilters = True
ditherfilterbrightness = 1.0

# --------------------------------------------------#
[drawingField]

slotRate = .03

# change the drawing mode
changeDrawingModeTime = 20
# if this is too high, it all gets "poppy"
bgColorAlpha = 10
# chance, per cycle, move the dither around
filterremappingprob = .002
# chance, per cycle, that overlay blocks are cleared
# not realy that useful because the composite image is
# always being added to so retains a continuous pile
# of layers
clearbgBoxprob = .0003
# chance, per cycle, that the line drawing jitters
doJitterProb = .01
# change Palette and Drawing
changeColorSetTime = 90
# the range of time changeColorSetTime X changeColorSetTimeMaxMultiplier
changeColorSetTimeMaxMultiplier = 3
# # when adding background blocks also jitter drawing
doJitterWhenAddingBG = True
# rate per cycle that a new bg is blended-in
blendLevelRateBase = .001

totalRandomPenColorProb = .5
totalRandomBGBoxColorProb = .02

jitterIterationsMin = 1
jitterIterationsMax = 30
jitterIterationsHoriz = 2
jitterIterationsVert = 2
alwaysJitterLineAfterDrawn = True


penAlpha = 200
changePenColorWhileDrawingProb = .01
pen_centerVariationXMin = 20
pen_centerVariationXMax = 20
pen_centerVariationYMin = 20
pen_centerVariationYMax = 20

# time to clear the canvas
changeTime = 0

fadeRateNewSystemThreshold = 2.0

# this guy is presented rotated -90
# so adjusting so the horizontal dither
# banding appears a more vertically biased
filterremapping = True
filterRemapMinHorzSize = 60
filterRemapMaxHorzSize = 300
filterRemapRangeX = 120
filterRemapMinVertSize = 8
filterRemapMaxVertSize = 90
filterRemapRangeY = 260

innerRadius = 50
outerRadius = 700

usebgBox = True
bgBoxBox = 0,0,384,256
bgTileSizeWidthMin = 33
bgTileSizeWidthMax = 160
bgTileSizeHeightMin = 33
bgTileSizeHeightMax = 129

bgBoxAlphaRange = 40,248
forcebgBox = True

compositionModeChangeProb = .01

bgGlitchCyclesMin = 4
bgGlitchCyclesMax = 30
bgGlitchDisplacementHorizontal = 6
bgGlitchDisplacementVertical = 6

# --------------------------------------------------#
penNames = longOvalSweeps1,longOvalSweeps2,longOvalSweeps2b,shortMarks,shortMarks2,scratchyLong,scratchyLong2,spiralGyres,spiralGyres2,lineMarksH1,lineMarks2
# paletteSets = PostItNotesBlueInk2,PostItNotesBlueInk2
# paletteSets = YellowsOnGrayTex
# paletteSets = acid_1,acid_2,rose_x,bluebrow,blue_w,rose_x,bluebrow,blue_w
# paletteSets = acid_1,acid_2,rose_x,bluebrow,blue_w,rose_x,bluebrow,blue_w,OnPink,OnBrown,OnGray,OnSystemBlue,CoastalIndustry,OnBrownDrawing,PostItNotesBlueInk2,dekoonig
# paletteSets = bluebrow
paletteSets = OnPink,OnBrown,OnSystemBlue,CoastalIndustry,OnBrownDrawing,bluebrow
textureSets = texture1,texture2,texture3,texture4,textureScrim2

