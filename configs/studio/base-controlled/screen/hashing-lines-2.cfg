[displayconfig]
#-----------------------------------------------#
work = hashing-v3
; -----------------------------------------------

checkForConfigChanges = True
doFullReloadOnChange = True

rotation = 0
fullRotation = True
rotationTrailing = False


tileSizeHeight = 32
tileSizeWidth = 64
matrixTiles = 48
rows = 7
cols = 9

screenWidth = 194
screenHeight = 224

# ---  preparing for rotation
windowWidth = 194
windowHeight = 224

canvasWidth = 194
canvasHeight = 224


# daemon7 set up FIRESIDE
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2583
windowYOffset = 117

# ----------------------------------------------------------- #

brightness = 1.0
minBrightness = 0

useFilters = True
ditherfilterbrightness = 1.0

# ----------------------------------------------------------- #

# Note the pixels tearing dissipates after 4 levels or blocks
usePixelSort = True
pixelSortRotatesWithImage = False
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 126
pixSortYOffset = 3
pixSortboxHeight = 128
pixSortboxWidth = 4
pixSortgap = 1
pixSortprobDraw = .2
pixSortprobGetNextColor = .9
pixSortProbDecriment = 4
pixSortSizeDecriment = 2.0
pixSortSampleVariance = 2
pixSortDrawVariance = 8
randomColorProbabilty = .04
brightnessVarLow = .5
brightnessVarHi = 1.9
pixelSortAppearanceProb = .73

# ----------------------------------------------------------- #

remapImageBlock = False
remapImageBlockSection = 0,0,32,64
remapImageBlockDestination = 0,0
remapImageBlockSectionRotation = 0

remapImageBlock2 = False
remapImageBlockSection2 = 0,0,28,128
remapImageBlockDestination2 = 0,0
remapImageBlockSection2Rotation = 0

remapImageBlock3 = True
remapImageBlockSection3 = 124,0,132,224
remapImageBlockDestination3 = 124,-20
remapImageBlockSection3Rotation = 0

# ----------------------------------------------------------- #

remapImageBlockShift = True
remapImageBlockShiftSection = 128,0,192,224
remapImageBlockShiftStableSection = 0,0,576,256
remapImageBlockShiftDestination = 128,-19

# ----------------------------------------------------------- #

#---------------------------------#

# hatching hashing lines
[hatchingmarks]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 194
drawingHeight = 194


# more loops and tangles
tangleProb = 1.0
backTrackRange = 1,10

# grid single-lines
drawingShape = grid
renderLinesAsEnvelope = True

; imageXPOSSpeed = .1

# these really control the feel of
# activity - frenetic grid, soft undulations
# sense of randomness on or through the grid
# @todo make into mode sets

xOffset = 3
pointsPerLineCol = 28
colAdj = 1
colFirst = True
noiseAmplitudeRangeCol = 1.1,4.0
colIntervalRange = 10,37
verticalMovement = True
verticalMovementProb = .002
vertLineChangeRange = .001,.02
vertLineSpeedRange = 1,3
vertBaseWidthRange = 0,0

yOffset = 3
pointsPerLineRow = 28
rowAdj = 1
rowIntervalRange = 10,37
horizontalMovement = True
noiseAmplitudeRangeRow = 1.1,4.0
horizontalMovementProb = 0.0020
horizLineChangeRange = .001,.002
horizLineSpeedRange = 1,3
horizBaseWidthRange = 0,0

uniformRatio = False
squareRatio = False

useSingleMode = False
# these only need to be set for singleMode
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 10
# line_alpha = 180

# chance per frame the overall drawing character changes
changeLinesProb = .0004
changeBGProb = 0.0003

lightMode = False
lightModeProb = .0
lightLinesOnGroundProb = .0
lightLinesOnGround = False


pauseProb = .0002
unpauseProb = .003


# when going full black/white return to base at this per cycle
bg_alpha_returnrate = .2



#-------------------------------------------------------
#----- for blanks_and_dither_remapping module ----------
#-------------------------------------------------------

#---------------------  blanks blocks ------------------
useBlanks = True
resetBlanksProb = .0002
numberOfDeadPixels = 3
blankColorAsColorProb = .0
sizeTarget = 364,300
colsRange = 64,128
rowsRange = 32,128
blankPolyVariation = 2

#--------------------- filterRemapping  ------------------

filterRemapping = True
filterRemappingProb = .002
filterRemapMinHoriSize = 12
filterRemapMaxHoriSize = 128
filterRemapMinVertSize = 3
filterRemapMaxVertSize = 16
filterRemapRangeX = 192
filterRemapRangeY = 128

contractXSpeed = 2
contractYSpeed = 2
expandXSpeed = 2
expandYSpeed = 2

#----- adding panel modulation to mimic physical panel differences
usingPanelOverlays = False
panelColumns = 0
panelRows = 0
panelWidth = 64
panelHeight = 64
panelOverlayRange = 5,10
panelOverlayChangeProb = .001
panelOverlayAmount = .11


#---------------------  bgparameters]

; paletteSets = palette_all_on_naples
; paletteSets = palette_pinks
paletteSets = palette_pinks,palette_aging

drawMoire = False
drawMoireProb = .01
drawMoireProbOff = .08

moireXPos  = 160
moireYPos  = 110
moireXDistance = 10
moireYDistance = 10

setMoireColor = True
moireColor = 0,140,60,50
moireColorAlt = 40,0,0,100
moireColorAltProb = .5

# chance that an overlay block is drawn
usebgBoxProb = .01
forceBgBox = True
useBgBox = True
clearbgBoxprob = .0003
bgBoxBox = 0,0,256,256

bgTileSizeWidthMin = 64
bgTileSizeHeightMin = 64
bgTileSizeWidthMax = 128
bgTileSizeHeightMax = 129


bgGlitchCyclesMin = 4
bgGlitchCyclesMax = 30
bgGlitchDisplacementHorizontal = 10
bgGlitchDisplacementVertical = 10

# chance that the background changes
backgroundColorChangeProb = .005

initialRunsOfBgBlocks = 30

