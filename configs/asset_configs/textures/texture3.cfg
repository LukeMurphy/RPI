# ------------------------------------- #
[texture]
name = texture3
useTextureLayer = True
# very scrim like
texture_step = 7
# dot size
texture_px = 2
# rows of dots
texture_rows = 64
# cols of dots
texture_cols = 64
# alpha change factor
texture_rate = 1
# base alpha value
texture_base = 26
# dot rgb
texture_clr_r = 140
texture_clr_g = 140
texture_clr_b = 150

texture_blockRows = 14
texture_blockCols = 20
# chance the block does not get drawn
texture_skipProb = .0001


texture_blur = 2
texture_xtick = 1
texture_ytick = 3
texture_drawMark = .980
texture_usedots = False

blendMode = subtract