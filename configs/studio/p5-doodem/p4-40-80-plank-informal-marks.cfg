scribbleRows = 11
scribbleCols = 18

scribbleAltColorProb = .3

#---------------------------------#

# chance per frame any line drawing character changes
changeLinesProb = .01
# chance per frame the overall drawing character changes
changeAllLinesProb = .0004
# chance that the background changes
changeBGProb = 0.001


lightMode = True
lightModeProb = .85
lightLinesOnGroundProb = .0
lightLinesOnGround = False

pauseProb = .0002
unpauseProb = .003

#---------------------  bgparameters]
