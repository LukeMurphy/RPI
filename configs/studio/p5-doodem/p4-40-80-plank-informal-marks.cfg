[informalMarksGrid]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 320
drawingHeight = 80


# more loops and tangles
backTrackRange = 1,10

renderLinesAsEnvelope = True

xOffset = 8
pointsPerLineCol = 8

#---------------------------------#
yOffset = 8
noiseAmplitudeRangeCol = .1,1.210
angleRange = 10,60
angleAltRange = -12,12
sizeRange = 5
vertLineWidthRange = 0,2

colIntervalRange = 39,39
rowIntervalRange = 6,6
