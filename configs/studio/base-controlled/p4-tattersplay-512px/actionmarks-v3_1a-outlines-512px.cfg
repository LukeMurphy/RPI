[displayconfig]
# --------------------------------------------------#
work = actionmarks_v3_1
# work = diagnostics
# --------------------------------------------------#

checkForConfigChanges = True
doFullReloadOnChange = True

rotation = 0
fullRotation = True
rotationTrailing = False


tileSizeHeight = 32
tileSizeWidth = 64
matrixTiles = 48
rows = 7
cols = 9

# ---  Also determines the window geometry
screenWidth = 576
screenHeight = 256

# ---  preparing for rotation
windowWidth = 576
windowHeight = 256

canvasWidth = 576
canvasHeight = 256

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# ----------------------------------------------------------- #

# Window Offset
windowXOffset = 2647
windowYOffset = 118

# ----------------------------------------------------------- #

brightness = 1.0
minBrightness = 0

useFilters = True
ditherfilterbrightness = .95

# ----------------------------------------------------------- #

remapImageBlock = False
remapImageBlockSection = 0,0,64,384
remapImageBlockDestination = 0,0
remapImageBlockSectionRotation = 0

remapImageBlock2 = False
remapImageBlockSection2 = 0,220,160,256
remapImageBlockDestination2 = 1,220
remapImageBlockSection2Rotation = 1

remapImageBlock3 = False
remapImageBlockSection3 = 224,0,256,384
remapImageBlockDestination3 = 0,0
remapImageBlockSection3Rotation = 0

# ----------------------------------------------------------- #

remapImageBlockShift = True
remapImageBlockShiftSection = 256,0,512,128
remapImageBlockShiftStableSection = 0,0,576,256
remapImageBlockShiftDestination = 320,0

# ----------------------------------------------------------- #



[drawingField]
# ----------------------------------------------------------- #

slotRate = .03

# change the drawing mode
changeDrawingModeTime = 30
# if this is too high, it all gets "poppy"
bgColorAlpha = 10

# chance, per cycle, that overlay blocks are cleared
# not realy that useful because the composite image is
# always being added to so retains a continuous pile
# of layers
clearbgBoxprob = .0003
# change Palette and Drawing
changeColorSetTime = 120
# the range of time changeColorSetTime X changeColorSetTimeMaxMultiplier
changeColorSetTimeMaxMultiplier = 2
# # when adding background blocks also jitter drawing
doJitterWhenAddingBG = True
# rate per cycle that a new bg is blended-in
blendLevelRateBase = .01

totalRandomPenColorProb = .5
totalRandomBGBoxColorProb = .02

# chance, per cycle, that the line drawing jitters
doJitterProb = .001
# probablility that after drawing jitter happens
doJitterWhenAddingBGUseProb = .50
# probablility that after LINE jitter happens
doJitterAfterLineUseProb = .50
# chance that the jitter happens all at once
doProgressiveJitterProb = .50
# probability jitter event happens per cycle
# 100% means it will continuously jitter until done
doJitterEventPerCyleProb = .50
jitterIterationsMin = 4
jitterIterationsMax = 30
jitterIterationsMaxAfterDraw = 10
jitterDisplacementHorizontal = 1
jitterDisplacementVertical = 1

jitterIterationsMin_roughing = 12
jitterIterationsMax_roughing = 30
jitterDisplacementHorizontal_roughing = 2
jitterDisplacementVertical_roughing = 2

justHitPauseProb = .0004
releaseFromJustHitPauseProb = .001

penAlpha = 200

# time to clear the canvas
changeTime = 0

fadeRateNewSystemThreshold = 2.0


#--------------------- filterRemapping  ------------------
filterremapping = True
filterRemappingProb = .002

filterRemapMinHorzSize = 60
filterRemapMaxHorzSize = 300
filterRemapMinVertSize = 8
filterRemapMaxVertSize = 90

filterRemapRangeX = 500
filterRemapRangeY = 260

contractXSpeed = 10
contractYSpeed = 20
expandXSpeed = 5
expandYSpeed = 2


innerRadius = 50
outerRadius = 700

usebgBox = True
bgBoxBox = 0,0,384,256
bgTileSizeWidthMin = 33
bgTileSizeWidthMax = 160
bgTileSizeHeightMin = 33
bgTileSizeHeightMax = 129

bgBoxAlphaRange = 40,248
forcebgBox = True



# --------------------------------------------------#
drawingBundle = studio/base-controlled/p4-tattersplay-512px/action_assets
loadPalettesFromCfgFiles = True
; paletteSets =   dekoonig_v2a

paletteSets =   lyricalGrid
                ,dripsAndDrab
                ,lyricalBlocks
                ,BathersWithTurtle
                ,BathersWithTurtleOutlined
                ,BathersWithTurtle2
                ,scribbles
                ,rose_x_nograys
                ,rose_xCurves
                ,VirHeroicusSublimis_v1
                ,CoastalIndustry
                ,OnPink_v2
                ,OnBrown_v1
                ,OnSystemBlue_v1
                ,PostItNotesBlueInk2_v1
                ,PostItNotesBlueInk2_v2
                ,dekoonig_v2
                ,dekoonig_v2a
                ,dekoonig_v2_outlined
                ,lasttwombly_outlined
                ,lasttwombly
                ,lasttwomblyxs


textureSets = texture1,texture2,texture3,textureScrim2,texture4
penNames =  lineMarksDashed,   
            lineMarksVertBands,
            lineMarksVertNarrow,
            longOvalSweeps1,
            longOvalSweeps2,
            longOvalSweeps2b,
            shortMarks,
            shortMarks2,
            scratchyLong,
            scratchyLong2,
            spiralGyres,
            spiralGyres2,
            lineMarksH1,
            lineMarks2,
            lineMarksVert,
            lineMarksVertHeavy,
            lineMarksVertHeavyLight,
            lineMarksVertHeavyLightColor,
            scribbleLine1



# default if not set in palatte
drawLineAsEnvelope = False
linesDrawnCountMinBase = 2



#####################################################
#####################################################
#####################################################


[diag]
#---------------------------------#

fontColor = 150,150,0
outlineColor = 120,0,0
fontColor2 = 0,100,100
bgColor = 0,0,104
showGrid = True
fontSize = 10

brightness = .2
outerColor = 10,0,100
innerColor = 120,40,0
borderColor = 10,0,0
