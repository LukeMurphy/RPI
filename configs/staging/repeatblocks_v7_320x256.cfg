# when updating all the blocks with the new palette,
# chance that each one accepts the change
changeEachblockWhenChangingPatternProb = 0.950

patternModelVariations = True
drawbgcolorEachCycle = True

# chance that the palette will draw a new color
# from the active palette when the pattern changes
# lower means more uniform palette
# a zero value prevents any palette mixing
