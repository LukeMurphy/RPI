[displayconfig]
# prostrate at the alter of the grid .... ;)
work = hashing-v3
; work = diagnostics
#---------------------------------#
; has reenforced shift counter to the setup that accounts for the physical 16px or 17px 
; physical shift of right panel

rotation = 0
checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 64
tileSizeWidth = 64
matrixTiles = 48
rows = 8
cols = 8

# ---  Also determines the window geometry
screenWidth = 256
screenHeight = 210

# ---  preparing for rotation
windowWidth = 256
windowHeight = 210

canvasWidth = 256
canvasHeight = 210

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2583
windowYOffset = 117


brightness = 1.1
minBrightness = 0


remapImageBlock = False
remapImageBlockSection = 0,0,248,180
remapImageBlockDestination = 0,0
# remapImageBlockSectionRotation = 0

remapImageBlock3 = False
remapImageBlockSection3 = 128,0,258,214
remapImageBlockDestination3 = 128,17
remapImageBlockSection3Rotation = 0


remapImageBlockShift = True
remapImageBlockShiftSection = 128,0,258,214
remapImageBlockShiftStableSection = 0,0,128,214
remapImageBlockShiftDestination = 128,17

remapImageBlockShift2 = False
remapImageBlockShiftSection2 = 128,0,258,214
remapImageBlockShiftStableSection2 = 0,0,128,214
remapImageBlockShiftDestination2 = 128,30

remapImageBlockShift3 = False
remapImageBlockShiftSection3 = 0,64,64,195
remapImageBlockShiftStableSection3 = 0,0,0,0
remapImageBlockShiftDestination3 = 16,64

remapImageBlockShift4 = False
remapImageBlockShiftSection4 = 64,83,180,180
remapImageBlockShiftStableSection4 = 0,0,0,0
remapImageBlockShiftDestination4 = 80,64





usePixelSort = False
pixelSortRotatesWithImage = False
pixSortDirection = lateral
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = -2
pixSortboxHeight = 1
pixSortboxWidth = 195
pixSortgap = 0
pixSortprobDraw = .02
pixSortprobGetNextColor = 1
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 12
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .9
brightnessVarHi = 1.1
pixelSortAppearanceProb = .99

useBlur = False
blurXOffset = 120
blurYOffset = 120
blurSectionWidth = 90
blurSectionHeight = 20
sectionBlurRadius = 2

useFilters = False
ditherfilterbrightness = 1.1


# ################################################### #
# hatching hashing lines

[hatchingmarks]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 256
drawingHeight = 196


# more loops and tangles
tangleProb = 1.0
backTrackRange = 1,10

# grid single-lines
drawingShape = grid
renderLinesAsEnvelope = True

; imageXPOSSpeed = .1

# these really control the feel of
# activity - frenetic grid, soft undulations
# sense of randomness on or through the grid
# @todo make into mode sets

xOffset = 6
pointsPerLineCol = 28
colAdj = 1
colFirst = True
noiseAmplitudeRangeCol = 1.1,4.0
colIntervalRange = 20,80
verticalMovement = True
verticalMovementProb = .002
vertLineChangeRange = .001,.02
vertLineSpeedRange = 1,3
vertBaseWidthRange = 0,0

yOffset = 8
pointsPerLineRow = 28
rowAdj = 1
rowIntervalRange = 20,80
horizontalMovement = True
noiseAmplitudeRangeRow = 1.1,4.0
horizontalMovementProb = 0.0020
horizLineChangeRange = .001,.002
horizLineSpeedRange = 1,3
horizBaseWidthRange = 0,0

uniformRatio = False
squareRatio = False

useSingleMode = False
# these only need to be set for singleMode
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 10
# line_alpha = 180

# chance per frame the overall drawing character changes
changeLinesProb = .0004
changeBGProb = 0.0003

lightMode = False
lightModeProb = .0
lightLinesOnGroundProb = .0
lightLinesOnGround = False


pauseProb = .0002
unpauseProb = .003


# when going full black/white return to base at this per cycle
bg_alpha_returnrate = .2


#---------------------  blanks blocks

resetBlanksProb = .0002
numberOfDeadPixels = 3
blankColorAsColorProb = .0
sizeTarget = 364,300
colsRange = 64,128
rowsRange = 32,128
blankPolyVariation = 2


#--------------------- filterRemapping  ------------------

filterRemapping = False
filterRemappingProb = .002
filterRemapMinHoriSize = 12
filterRemapMaxHoriSize = 256
filterRemapMinVertSize = 3
filterRemapMaxVertSize = 16
filterRemapRangeX = 384
filterRemapRangeY = 320

contractXSpeed = 10
contractYSpeed = 10
expandXSpeed = 10
expandYSpeed = 10

#---------------------  adding panel modulation to mimic physical panel differences

panelColumns = 0
panelRows = 0
panelWidth = 64
panelHeight = 64
panelOverlayRange = 5,10
panelOverlayChangeProb = .001
panelOverlayAmount = .11


#---------------------  bgparameters]

paletteSets = palette_pinks,palette_all_on_naples,palette_aging

drawMoire = True
drawMoireProb = .01
drawMoireProbOff = .08

moireXPos  = 160
moireYPos  = 110
moireXDistance = 10
moireYDistance = 10

setMoireColor = True
moireColor = 0,140,60,50
moireColorAlt = 40,0,0,100
moireColorAltProb = .5

# chance that an overlay block is drawn
usebgBoxProb = .01
forceBgBox = False
useBgBox = False
clearbgBoxprob = .0003
bgBoxBox = 0,0,256,256

bgTileSizeWidthMin = 64
bgTileSizeHeightMin = 64
bgTileSizeWidthMax = 128
bgTileSizeHeightMax = 129


bgGlitchCyclesMin = 4
bgGlitchCyclesMax = 30
bgGlitchDisplacementHorizontal = 10
bgGlitchDisplacementVertical = 10

# chance that the background changes
backgroundColorChangeProb = .005

initialRunsOfBgBlocks = 30

