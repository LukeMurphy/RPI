disturbanceConfigSets = light-medium
# disturbanceConfigSets = medium-heavy-horiz-bias
; disturbanceConfigSets = medium-heavy
# disturbanceConfigSets = minimal

changeDisturbanceSetProb = .25
stableSectionsMin = 2
stableSectionsMax = 3
stableSectionsMinWidth = 200
stableSectionsMinHeight = 24


#--------- WAVE DISTORTIONS ------------------
useWaveDistortion = True
waveAmplitude = 20
waveAmplitudeMin = -20
wavePeriodMod = 5
wavegridspace = 30
pNoiseMod = 10
waveDeformXPosRate = .001
waveAmplitudeSpeed = .0001
# waveAmplitudeSpeed = .0002

#--------- Transform       ------------------
transformShape = False
# width skew
# vertical sheer
# haorizontal ,vertical perspective
# transformTuples = 1.0, 1.0, .0, -.0,  1.50, 2.0, 0.0, 0.002
# transformTuples = .9, .0, .0, -.0,  1.0, .91, 0.001, 0.001
transformTuples = 1.20, 0, 1.0, -.0, 1, 0.10, 0.005, 0.000


#--------------------- PATTERNS  ---------------------

# dimensions of each pattern block
blockSizeChangeProb = .5
blockSizeChangeAlwaysUseMax = False
blockWidthMin = 48
blockWidthMax = 64

#--------------------- PATTERN CHANGE   ---------------------
# higher = more variation in patterns
# e.g. .2 is 20% chance each new block will change to a
# new pattern
patternChangeWhenBuilding = .05

# ***********  IMPORTANT **********************************
# rate the patterns change - if lower, then the distortions
# are more complete - checked each cycle so
# .001 roughly is a 3% chance every second
rebuildPatternProbability = 0.0004

# when the rebuildPattern function is called :
# the probability the whole pattern sequence is rebuilt
rebuildAllSlotsProb = .001

# the probility that random slots are used vs groups of
# sequential slots 
chanceRebuildPatternChoosesRandom = .20

# if random slots are changed, the probablility each one 
# gets selected 
rebuildIndividualSlotProb = .9

# when making a list of slots to change, the probability
# it skips for a while then starts adding again
rebuildSlotSkipRate = .1
rebuildSlotStartSkipRate = .05
# ***********  IMPORTANT **********************************

# checked every cycle, does combination set change?
# changeCombinationAnytimeProb = .00008
changeCombinationAnytimeProb = .99

# checked every cycle after fading done, does palette change?
; changePaletteAnytimeProb = .0002

# ***********  IMPORTANT **********************************

# does a rebuild of a new palette if combo changes
changePaletteWhenRebuildProb = .25

# after a new palette is chosen, does it force an pattern rebuild
probPatternsRebuildAfterNewPalette = .99

# chance that when the palette changes, it pulls
# a whole new palette from the available list
# lower means more uniform palette
changeFullPaletteWhenChangingPatternProb = 0.50

# when updating all the blocks with the new palette,
# chance that each one accepts the change
changeEachblockWhenChangingPatternProb = 0.950

patternModelVariations = True
drawbgcolorEachCycle = True


# chance that the palette will draw a new color
# from the active palette when the pattern changes
# lower means more uniform palette
# a zero value prevents any palette mixing
changePaletteWhenChangingPatternProb = 0.0


#--- individual pattern parameters  ---------------------
# forces the patterns to align to a certain rotation
# useful instead of rotation the whole piece etc
patternOrientation = 180

# increases density of pattern for diamonds, balls, shingles
numRows = 2
numDotRows = 3
numRowsRandomize = False
numShingleRows = 2

shingleVariation = True
shingleVariationRange = 6

# to be nice and even, has to be even multiple of blockWidth
# if you want artifact, then anything else ;)
lineDiff = 2
useDoubleLine = True

# decobox controls
decoboxbandwidth = 3

#waveScales controls
linesOnly = False
numScaleRows = 4
ringsRange = 10,18
stepsRange = 2,3

# for the diamond pattern
diamondStep = 1
randomizeSpeed = True

# for any moving pattern: diamond, reMove
xSpeed = .8
ySpeed = .1

# for the concentric squares
# careful with this, too many over the
# blockWidth will cause an issue....
minnumConcentricBoxes = 2
maxnumConcentricBoxes = 16

# for the randomizer
randomBlockProb = .99
randomBlockWidth = 0
randomBlockHeight = 0

# For the sine wave repeater
steps = 2
amplitude = 9
yOffset = 12

steps2 = 2
amplitude2 = 9
yOffset2 = 13
phaseFactor = 4
speedFactor = 1



