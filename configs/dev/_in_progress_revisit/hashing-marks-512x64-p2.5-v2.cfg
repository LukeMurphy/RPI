[displayconfig]
#----------------------------------------------------#
work = hashing-v2
# work = diagnostics
#----------------------------------------------------#

rotation = 0
checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 64
tileSizeWidth = 64

rows = 5
cols = 6

# ---  Also determines the window geometry
screenWidth = 512
screenHeight = 128

# ---  preparing for rotation
windowWidth = 512
windowHeight = 128

canvasWidth = 512
canvasHeight = 128

imageXOffset = 0
imageYOffset = 0

# - for small adjustments when sending to 
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2583
windowYOffset = 118



brightness =  1.0
minBrightness = 0

usePixelSort = False
pixelSortRotatesWithImage = True
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 20
pixSortYOffset = 90
pixSortboxHeight = 344
pixSortboxWidth = 5
pixSortgap = 0
pixSortprobDraw = .7
pixSortprobGetNextColor = .9
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 2
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .99
brightnessVarHi = 1.0
pixelSortAppearanceProb = .99


## This is re-used by the dither filter
## to set the patch affected
remapImageBlock = False		
remapImageBlockSection = 0,0,256,512
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0

remapImageBlock2 = True
remapImageBlockSection2 = 256,0,512,64
remapImageBlockDestination2 = 0,64
remapImageBlockSection2Rotation = 0

useBlur = False
blurXOffset = 0
blurYOffset = 0
blurSectionWidth = 448
blurSectionHeight = 192
sectionBlurRadius = 1

useFilters = False

# ################################################### #
# hatching hashing lines

[hatchingmarks]
#---------------------------------#
# Framerate
redrawSpeed = .05
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 511
drawingHeight = 60

noiseAmplitude = 2
noiseAmplitudeRange = 1.1,4.0
lineSpeedRange = 1,3
baseWidthRange = 0,2
drawingHeightRange = 200,500
ratioFactorRange = 1,1
distributionRange = 4
numberOfinformalLines = 7

# more loops and tangles
tangleProb = 0.0
backTrackRange = 1,10

# grid single-lines
drawingShape = grid
renderLinesAsEnvelope = True

# these really control the feel of
# activity - frenetic grid, soft undulations
# sense of randomness on or through the grid
# @todo make into mode sets

xOffset = 0
pointsPerLineCol = 28
colInterval = 1
colAdj = 1
noiseAmplitudeRangeCol = 1.1,4.0
colIntervalRange = 1,1
verticalMovement = True
verticalMovementProb = .01
vertLineChangeRange = .001,.002

yOffset = 0
pointsPerLineRow = 28
rowInterval = 1
rowAdj = 1
rowIntervalRange = 2,7
noiseAmplitudeRangeRow = 1.1,4.0
horizontalMovement = True
horizontalMovementProb = 0.020
horizLineChangeRange = .001,.002


uniformRatio = False
squareRatio = False
useSingleMode = False

# these only need to be set for singleMode
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 10
# line_alpha = 180

# chance per frame the overall drawing character changes
changeLinesProb = .004
changeBGProb = 0.001
lightModeProb = .1

pauseProb = .0002
unpauseProb = .003

bg_alpha_range = 20,40
line_alpha_range = 18,30

# when going full black/white return to base at this per cycle
bg_alpha_returnrate = .2

# smoothness + speed - higher is smoother
frames = 8
scrollRate = 0

line_minHue = 0
line_maxHue = 50
line_minSaturation = .7
line_maxSaturation = .99
line_minValue = .50
line_maxValue = 1.0
line_dropHueMin = 40
line_dropHueMax = 60


bg_minHue = 355
bg_maxHue = 60
bg_minSaturation = 0.9
bg_maxSaturation = 0.9
bg_minValue = .02
bg_maxValue = .1





[diag]
#---------------------------------#

fontColor = 255,255,0
outlineColor = 255,0,0
fontColor2 = 0,0,100
bgColor = 0,0,254
showGrid = True
fontSize = 14

brightness =  .2
outerColor = 10,0,100
innerColor = 230,40,0
borderColor = 10,0,0

