[displayconfig]
#----------------------------------------------------#
#work = diagnostics
# work = quilt-poly
work = quilt-poly-v2
#----------------------------------------------------#

rotation = 0
fullRotation = True
rotationTrailing = False

checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 32
tileSizeWidth = 64
matrixTiles = 48
rows = 7
cols = 4

# ---  Also determines the window geometry
screenWidth = 260
screenHeight = 230

# ---  preparing for rotation
windowWidth = 260
windowHeight = 230

canvasWidth = 260
canvasHeight = 230

# daemon7 set up FIRESIDE
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2583
windowYOffset = 374

brightness =  1.0
minBrightness = 0

useFilters = False
ditherfilterbrightness = .99

remapImageBlock = False
remapImageBlockSection = 0,0,256,384
remapImageBlockDestination = 0,0
remapImageBlockSectionRotation = 0


remapImageBlock2 = True
remapImageBlockSection2 = 0,220,160,256
remapImageBlockDestination2 = 1,220
remapImageBlockSection2Rotation = 1

remapImageBlock3 = False
remapImageBlockSection3 = 224,0,256,384
remapImageBlockDestination3 = 0,0
remapImageBlockSection3Rotation = 0

[quilt-polys]
#---------------------------------#
pattern = polys

# Framerate
delay = .02
redrawSpeed = .03
slotRate = .03

## Approximating timing so that any one triange changes once every 2 minutes or so
## e.g. .0005 prob checked every .01 seconds ~ .0005/ .01s = 5% chance per second ...
resetTrianglesProb = .9995
colorPopProb = .0001

# the probability that at the completion of all transisitons that
# a new quilt sizeing will be made
resetSizeProbability  = .5

blockSizeMin = 8
blockSizeMax = 10

blockColsMin = 8
blockRowsMin = 8

blockColsMax = 8
blockRowsMax = 8

gapSize = 0

cntrOffsetX = 0
cntrOffsetY = 0

lines = False
patternPrecision = True

timeToComplete = 60
transitionStepsMin = 25.0
transitionStepsMax = 150.0
randomness = 4

redRange = 320,10

## Like the "stiching" color
brightnessFactorDark = .61
brightnessFactorLight = .99


transformShape = False

## No transform
transformTuples = 1, .5, 0, 0.0,  1, 0, 0.0, 0.0


activeSet = set2



[set1]
## red grid, greens for squares - high lumen
## BASE
c1HueRange = 0,36
c1SaturationRange = .8,1
c1ValueRange = .5,.8

## SQUARE
c2HueRange = 90,180
c2SaturationRange = .4,.6
c2ValueRange = .5,.6

## CENTER
c3HueRange = 0,36
c3SaturationRange = .9,1
c3ValueRange = .8,.99


[set2]
## diamond/sqaures recede due to being low saturarion
## BASE
c1HueRange =  1,360
c1SaturationRange = .8,1
c1ValueRange = .8,.99

## SQUARE
c2HueRange = 0,360
c2SaturationRange = .1,.5
c2ValueRange = .1,.8

## CENTER
c3HueRange = 0,360
c3SaturationRange = 1,1
c3ValueRange = .1,.8

[set3]
#	Red center diamonds
## BASE
c1HueRange = 1,360
c1SaturationRange = .8,1 
c1ValueRange = .3,.5

## SQUARE
c2HueRange = 1,20
c2SaturationRange = .8,1
c2ValueRange = .9,1

## CENTER
c3HueRange = 0,360
c3SaturationRange = .7,.9
c3ValueRange =  .1,.5

[set4]
#	Red grid - has most stained-glass feel ++

## BASE
c1HueRange = 0,29 
c1SaturationRange =  .9,1
c1ValueRange = .2,.22

## SQUARE
c2HueRange =  1,360
c2SaturationRange = .8,1
c2ValueRange = .4,.5

## CENTER
c3HueRange =  0,32
c3SaturationRange = .9,1
c3ValueRange = .5,.51





#---------------------------------------------------------------------
[distortionsConfigs]
#---------------------------------------------------------------------

blockWidth = 48
blockHeight = 48

canvasOffsetX = 0
canvasOffsetY = 0

#--------------------- DISTURBANCES  ---------------------
sectionDisturbance = True
disturbanceConfigSets = heavy
changeDisturbanceSetProb = .01

stableSectionsMin  = 5
stableSectionsMax  = 12
stableSectionsMinWidth  = 64
stableSectionsMinHeight  = 128

# tieing this to changes in the piece
# rather than by straight probability
# otherwise can result in a jaring overlay
stableSectionsChangeProb  = .00
rebuildPatternProbability = .00

sectionWidthRange = 64,128
sectionHeightRange = 64,128

sectionPlacementXRange = 0,256
sectionPlacementYRange = 0,384

sectionRotationRange = 20

#--------- WAVE DISTORTIONS ------------------
useWaveDistortion = True
waveAmplitude = 30
wavePeriodMod = 2
wavegridspace = 40
pNoiseMod = 10
waveDeformXPosRate = .06
#--------------------- DISTURBANCE SETS #---------------------

[heavy]
numberOfSections = 70
# the number of steps per section movement
sectionMovementCountMax = 100
sectionWidthRange = 8,180
sectionHeightRange = 8,180
sectionPlacementXRange = -10,256
sectionPlacementYRange = -10,384
sectionRotationRange = .5
stopProbMax = .001

# higher number reduces the speed in that direction
baseSectionSpeed = .080
sectionSpeedFactorHorizontal = 1.0
sectionSpeedFactorVertical = 1.0
rebuildImmediatelyAfterDone = False
redoSectionDisturbance = 0.01

diagonalmovement = True
randomDiagonal = True 
diagonalFixedAngle = 0

# the decrement in pasted movement - the higher the number up to 1.0 + 
# produces faster turbulence
# .86 is slower and more controlled with enough lateral motion to
# cause nice turbulent distortion
speedDeAcceleration = .86
speedDeAccelerationUpperLimit = .96

[standard]
numberOfSections = 30
# the number of steps per section movement
sectionMovementCountMax = 10
sectionWidthRange = 8,80
sectionHeightRange = 8,80
sectionPlacementXRange = -10,384
sectionPlacementYRange = -10,200
sectionRotationRange = .01
stopProbMax = .01

# higher number reduces the speed in that direction
baseSectionSpeed = .08
sectionSpeedFactorHorizontal = .80
sectionSpeedFactorVertical = 1.2
rebuildImmediatelyAfterDone = False
redoSectionDisturbance = 0.01

diagonalmovement = False
randomDiagonal = True 
diagonalFixedAngle = 0

# the decrement in pasted movement - the higher the number up to 1.0 + 
# produces faster turbulence
# .86 is slower and more controlled with enough lateral motion to
# cause nice turbulent distortion
speedDeAcceleration = .86
speedDeAccelerationUpperLimit = .96




[diag]
#-----------------------------------------------#
fontColor = 0,100,90
outlineColor = 100,0,100
fontColor2 = 90,100,0
bgColor = 0,0,50
showGrid = True
fontSize = 9

brightness =  .8
outerColor = 0,0,100
innerColor = 30,40,0
borderColor = 0,0,0

