[displayconfig]
#----------------------------------------------------#
work = hashing-v2
# work = diagnostics
#----------------------------------------------------#

rotation = 0
checkForConfigChanges = False
doFullReloadOnChange = False

tileSizeHeight = 32
tileSizeWidth = 64

rows = 12
cols = 9

# ---  Also determines the window geometry
screenWidth = 512
screenHeight = 224

# ---  preparing for rotation
windowWidth = 512
windowHeight = 224

canvasWidth = 512
canvasHeight = 224

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 105
windowYOffset = 150


brightness = 1.0
minBrightness = 0

imageXOffset = 0
imageYOffset = 0

remapImageBlock = False
remapImageBlockSection = 0,0,32,22
remapImageBlockDestination = 0,0

remapImageBlock2 = False
remapImageBlockSection2 = 0,96,768,128
remapImageBlockDestination2 = 512,0

remapImageBlock3 = False
remapImageBlockSection3 = 512,0,576,32
remapImageBlockDestination3 = 0,32

remapImageBlock4 = False
remapImageBlockSection4 = 576,0,768,32
remapImageBlockDestination4 = 0,64

remapImageBlockShift = False
remapImageBlockShiftSection = 0,128,268,512
remapImageBlockShiftStableSection = 0,0,268,128
remapImageBlockShiftDestination = 38,128

usePixelSort = False
pixelSortRotatesWithImage = False
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 0
pixSortboxHeight = 192
pixSortboxWidth = 1
pixSortgap = 0
pixSortprobDraw = .7
pixSortprobGetNextColor = 1
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 12
pixSortDrawVariance = 1
randomColorProbabilty = .001
brightnessVarLow = .9
brightnessVarHi = 1.1
pixelSortAppearanceProb = .99

useBlur = False
blurXOffset = 120
blurYOffset = 120
blurSectionWidth = 90
blurSectionHeight = 20
sectionBlurRadius = 2

useFilters = False
ditherfilterbrightness = .95

# --------------------------------------------------#

# ################################################### #
# hatching hashing lines

[hatchingmarks]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 512
drawingHeight = 224

; imageXPOSSpeed = .1

noiseAmplitude = 2
noiseAmplitudeRange = 1.1,4.0
lineSpeedRange = 1,3
baseWidthRange = 0,0
drawingHeightRange = 200,500
ratioFactorRange = 1,1
distributionRange = 4
numberOfinformalLines = 7

# more loops and tangles
tangleProb = 1.0
backTrackRange = 1,10

# grid single-lines
drawingShape = grid
renderLinesAsEnvelope = True

# these really control the feel of
# activity - frenetic grid, soft undulations
# sense of randomness on or through the grid
# @todo make into mode sets

xOffset = 0
pointsPerLineCol = 28
colAdj = 1
colFirst = True
noiseAmplitudeRangeCol = 1.1,4.0
colIntervalRange = 20,80
verticalMovement = True
verticalMovementProb = .002
vertLineChangeRange = .001,.02
vertLineSpeedRange = 1,3
vertBaseWidthRange = 0,0

yOffset = 0
pointsPerLineRow = 28
rowAdj = 1
rowIntervalRange = 20,80
horizontalMovement = True
noiseAmplitudeRangeRow = 1.1,4.0
horizontalMovementProb = 0.0020
horizLineChangeRange = .001,.002
horizLineSpeedRange = 1,3
horizBaseWidthRange = 0,0

uniformRatio = False
squareRatio = False

useSingleMode = False
# these only need to be set for singleMode
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 10
# line_alpha = 180

# chance per frame the overall drawing character changes
changeLinesProb = .0008
changeBGProb = 0.0004

lightMode = False
lightModeProb = .5

pauseProb = .0002
unpauseProb = .003

bg_alpha_range = 20,140
line_alpha_range = 18,30

# when going full black/white return to base at this per cycle
bg_alpha_returnrate = .2

# smoothness + speed - higher is smoother
frames = 8
scrollRate = 0

line_minHue = 0
line_maxHue = 60
line_minSaturation = .5
line_maxSaturation = .50
line_minValue = .05
line_maxValue = .10
line_minDropHue = 0
line_maxDropHue = 0

line_light_minHue = 40
line_light_maxHue = 50
line_light_minSaturation = .5
line_light_maxSaturation = .50
line_light_minValue = .65
line_light_maxValue = 1.0
line_light_minDropHue = 0
line_light_maxDropHue = 0
line_light_alpha_range = 180,230


bg_minHue = 355
bg_maxHue = 60
bg_minSaturation = 0.2
bg_maxSaturation = 0.5
bg_minValue = .6
bg_maxValue = .6
bg_dropHueMin = 11
bg_dropHueMax = 50

bgSets = 32,50,.2,.99,.9,.9|355,10,.2,.5,.6,.6

# blanks blocks
resetBlanksProb = .0005
numberOfDeadPixels = 2
blankColorAsColorProb = .0
sizeTarget = 320,280
colsRange = 32,128
rowsRange = 32,128



#--------------------- filterRemapping  ------------------

filterRemapping = True
filterRemappingProb = .002
filterRemappingReappearProb = .02
filterRemapMinHoriSize = 2
filterRemapMaxHoriSize = 32
filterRemapMinVertSize = 3
filterRemapMaxVertSize = 280
filterRemapRangeX = 320
filterRemapRangeY = 280

contractXSpeed = 10
contractYSpeed = 10
expandXSpeed = 10
expandYSpeed = 10





