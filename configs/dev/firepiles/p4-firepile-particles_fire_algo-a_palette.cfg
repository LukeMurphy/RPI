[displayconfig]
#----------------------------------------------------##----------------------------------------------------#
# work = diagnostics
work = particles-v2
#----------------------------------------------------##----------------------------------------------------#

# changed to -90 from 90
rotation = 90
fullRotation = True
rotationTrailing = False
checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 32
tileSizeWidth = 64
matrixTiles = 32
rows = 8
cols = 4

# ---  Also determines the window geometry
screenWidth = 256
screenHeight = 258

# ---  preparing for rotation
windowWidth = 256
windowHeight = 258

canvasWidth = 256
canvasHeight = 258

# daemon7 set up FIRESIDE
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
# windowXOffset = 120
# windowYOffset = 120

# Window Offset
# windowXOffset = 2647
# windowYOffset = 60

# Window Offset
windowXOffset = 1647
windowYOffset = 269

brightness =  1.0
minBrightness = 0

usePixelSort = True
pixelSortRotatesWithImage = True
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 0
pixSortboxHeight = 256
pixSortboxWidth = 80
pixSortgap = 0
pixSortprobDraw = .2
pixSortprobGetNextColor = .99
pixSortSizeDecriment =  1.0
pixSortProbDecriment = .0
pixSortSampleVariance = 3
pixSortDrawVariance = 0
pixSortDirection = medial
randomColorProbabilty = .1
brightnessVarLow = .05
brightnessVarHi = 1.6
pixelSortAppearanceProb = .99

# changed to True
useFilters = True

forceBGSwap = False


# added this
## This is re-used by the dither filter
## to set the patch affected
remapImageBlock = False		
remapImageBlockSection = 0,0,256,256
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0

[midnightBlue]
# fillColor = 140,0,58,35
# outlineColor = 200,90,0,200
# # changed this to make it a bit darker like original
# bgColor = 10,0,40,80

particle_fillRange = 350,33,.80,1.0,.5,1.0,10,20,0,255
particle_outlineRange = 340,40,.50,1.0,.3,1.0,100,200,0,255

# backgroundColor controls
bg_fillRange = 210, 270, 0.8, 1.0, 0.1, 0.3, 10, 200,0,255
bg_bgTransitions = True
bg_bgRangeA = 10
bg_bgRangeB = 30
bg_tLimitBase = 20

overallBlur = 2
unitBlur = 0

pixelsGoGray = True
pixelsGoGrayModel = 1
jumpToGray = True
greyRate = 80

#-------------------------------------------##----------------------------------------------------#
[particleSystem]
#-------------------------------------------##----------------------------------------------------#
numUnits = 490
delay = .033
slotRate = .03
restartprob = .001


# COLOR SETTINGS
# ----------------------------------

palettes = midnightBlue,midnightBlue
paletteChangeProb = .001


# ----------------------------------
### If this is True, always creating just
### one unit when one goes off screen vs.
### bursting -- prevents flickering of the
### units when one gets removed and the
### drawing order changes mid-stream
fixedUnitArray = True
objColor = fixed
objTrails = False
trailingFade = 200
renderDiagnostics = False
# ----------------------------------

objWidth = 50
objHeight = 60
objType = rect

speedMin = .5
speedMax = 3

widthRate = .952
heightRate = .97

centerRangeXMin = 50
centerRangeXMax = 200
centerRangeYMin = 80
centerRangeYMax = 240

# travel fire linearMotion
movement = fire
linearMotionAlsoHorizontal = False
useFlocking = False
cohesionDistance = 40
repelDistance = 3
repelFactor = 2
clumpingFactor = 1
distanceFactor = 1
cohesionDegrades = .99
changeCohesion = False
meanderFactor = 10
meanderFactor2 = 10
meanderDirection = 0
onedirection = False

particleWinkOutXMin = 1
particleWinkOutYMin = 1

ignoreBottom = False
borderCollisions = True
expireOnExit = True
reEmitNumber = 2

collisionDamping = 1
damping = 1
torqueDelta = 0
torqueRate = 0
xWind = 0
xGravity = 0
yGravity = 0



# ----------------------------------
useOverLay = False
overlayColor = 160,0,200,10
clrBlkWidth = 150
clrBlkHeight = 140
overlayxPos = 28
overlayyPos = 100
#overlayColor = 88,40,0,190

# ----------------------------------
# added this because the first one didn't have sparks
# moves the dither sparkle around
filterRemapping = True
filterRemappingProb = .08
filterRemapminHoriSize = 240
filterRemapminVertSize = 240
filterremaprangex = 240
filterremaprangey = 240




#----------------------------------------------------##----------------------------------------------------#
[diag]
#----------------------------------------------------##----------------------------------------------------#
fontColor = 0,100,90
outlineColor = 205,0,0
fontColor2 = 90,100,0
bgColor = 0,0,100
showGrid = True
fontSize = 10

brightness =  .8
outerColor = 0,0,100
innerColor = 30,40,0
borderColor = 0,0,0