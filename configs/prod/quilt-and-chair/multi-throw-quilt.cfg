[worksList]

# this is for the quilt - chair intersection piece
# the chair was found on 118th st - discarded from the old folks home
# the double quilt patterns are the log cabin/ court steps with a triangles backdrop

# startup files are in ~/.config/autostart/startup1.desktop

works = w2,w1
# ---  Also determines the window geometry
screenWidth = 324
screenHeight = 260

# ---  preparing for rotation
windowWidth = 324
windowHeight = 260

canvasWidth = 324
canvasHeight = 260

imageXOffset = 0
imageYOffset = 0

# - for small adjustments when sending to 
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 150
windowYOffset = 150

repaintDelay = 0.033


[w1]
cfg = prod/quilt-and-chair/quilt-triangles-v2.cfg
canvasOffsetX = 10
canvasOffsetY = -210
canvasRotation = 22.5
randomChange = False

[w2]
cfg = prod/quilt-and-chair/quilt-logcabin.cfg
canvasOffsetX = 0
canvasOffsetY = 0
canvasRotation = 0
randomChange = False
