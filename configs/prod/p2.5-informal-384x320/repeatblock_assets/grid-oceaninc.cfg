[grid-oceaninc]
patterns =  gothic1
            ,fishScales
            ,wavePattern2
            ,waveScales
            ,balls
            ,compass_hili
            ,TVTestPattern

; palettes =  ocean-sky
palettes =  17thsky
            ,delft
            ,deep
            ,ocean-sky


dominantPatterns = waveScales
dominantPatternProb = .3
# patternInBands False means different patterns
# appear in vertical strips
patternsInBands = False
# Border Controls
borderPattern = TVTestPattern
useBorderPattern = False
borderLeakProb = .1

altColoringProb = .5
popRandomColorProb = .1

maxNumberOfRandomizers = 6
minNumberOfPatternVariations = 6

randomInsertions = TVTestPattern
randomInsertionInitialProbabilitly = .03
randomInsertionProbabilitly = .05
randomInsertionMin = 1
randomInsertionMax = 1

usePolygonOverlay = False
tileOverlayGridProb = .5
# overlay subtract_modulo soft_light lighter
polyOverlayMode = overlay

combinationSetsMinTime = 33
