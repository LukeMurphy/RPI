[displayconfig]

# work = diagnostics
work = lsys


rendering = hub
rotation = 90
fullRotation = False
rotationTrailing = False
checkForConfigChanges = True
doFullReloadOnChange = True

isRPI = False

tileSizeHeight = 32
tileSizeWidth = 64
matrixTiles = 32
rows = 8
cols = 3

# ---  Also determines the window geometry
screenWidth = 256
screenHeight = 256

# ---  preparing for rotation
windowWidth = 256
windowHeight = 256

canvasWidth = 256
canvasHeight = 256

imageXOffset = 3
imageYOffset = 3

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# ---  Window Offset
windowXOffset = 217
windowYOffset = 69

#windowXOffset = 1646
#windowYOffset = 65


brightness =  .8
minBrightness = 0

remapImageBlock = False
