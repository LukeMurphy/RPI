#--------- WAVE DISTORTIONS ------------------
useWaveDistortion = True
waveAmplitude = 30
wavePeriodMod = 5
wavegridspace = 30
pNoiseMod = 10
waveDeformXPosRate = .003

#--------- Transform       ------------------
transformShape = False
# width skew  
# vertical sheer
# haorizontal ,vertical perspective
# transformTuples = 1.0, 1.0, .0, -.0,  1.50, 2.0, 0.0, 0.002
# transformTuples = .9, .0, .0, -.0,  1.0, .91, 0.001, 0.001
transformTuples = 1.20, 0, 1.0, -.0,  1, 0.10, 0.005, 0.000

#--------------------- PATTERNS  ---------------------
# the types of pattern
# wavePattern 
# reMove -->lines move
# diagonalMove  --> block moves 
# randomizer
# runningSpiral
# concentricBoxes
# runningSpiral
# diamond
# shingles
# circles
# waveScales
# fishScales
# wavePattern2
# compass
# circlesPacked
# coloredBlocks

# patterns = randomizer2,waveScales,fishScales,fishScales,wavePattern2,waveScales
patterns = waveScales,fishScales,randomizer2,waveScales

# patterns = diamond,diamond

# initial patternModel -- this is NOT used if the patterns list is specified!
patternModel = waveScales
patternSequence = waveScales,0,0

# Border Controls
borderPattern = compass
useBorderPattern = False


# dimensions of each pattern block
blockWidth = 32
blockHeight = 32

# number of rows & cols drawn
cols = 10
rows = 10

blockSizeChangeProb = .2
blockSizeChangeAlwaysUseMax = False
blockWidthMin = 46
blockWidthMax = 64

# the higher the pattern sequence limits,
# means more changes in the patterns shown
# NOT IN USE CURRENTLY
patternSequenceMin = 3
patternSequenceMax = 8

#--------------------- PATTERN CHANGE   ---------------------
# higher = more variation in patterns
# e.g. .2 is 20% chance each new block will change to a
# new pattern
patternChangeWhenBuilding = .15

# rate the patterns change - if lower, then the distortions 
# are more complete - checked each cycle so
# .001 roughly is a 3% chance every second
# ***********  IMPORTANT *****************

rebuildPatternProbability = 0.001

# ***********  IMPORTANT *****************

patternModelVariations = True
drawbgcolorEachCycle = True
changePaletteWhenRebuildProb = .85
changePaletteAnytimeProb = .001

# chance that the palette will draw a new color
# from the active palette when the pattern changes
# lower means more uniform palette 
# ***********  IMPORTANT *****************
# a zero value prevents any palette mixing 
changePaletteWhenChangingPatternProb = 0.0

# chance that when the palette changes, it pulls
# a whole new palette from the available list
# lower means more uniform palette
changeFullPaletteWhenChangingPatternProb = 0.50


#--- individual pattern parameters  ---------------------
# forces the patterns to align to a certain rotation
# useful instead of rotation the whole piece etc
patternOrientation = 0

# increases density of pattern for diamonds, balls, shingles
numRows = 2
numDotRows = 3
numRowsRandomize = False
numShingleRows = 2

shingleVariation = True 
shingleVariationRange = 6

# to be nice and even, has to be even multiple of blockWidth
# if you want artifact, then anything else ;)
lineDiff = 2
useDoubleLine = True

# decobox controls
decoboxbandwidth = 3

#waveScales controls
linesOnly = False
numScaleRows = 4
ringsRange = 10,18
stepsRange = 2,3

# for the diamond pattern
diamondStep = 1
randomizeSpeed = True

# for any moving pattern: diamond, reMove
xSpeed = .8
ySpeed = .1

# for the concentric squares
# careful with this, too many over the
# blockWidth will cause an issue....
minnumConcentricBoxes = 2
maxnumConcentricBoxes = 16

# for the randomizer
randomBlockProb = .1
randomBlockWidth = 0
randomBlockHeight = 0


# For the sine wave repeater
steps = 2
amplitude = 9
yOffset = 12

steps2 = 2
amplitude2 = 9
yOffset2 = 13
phaseFactor = 4
speedFactor = 1


#--------------------- COLORS   ---------------------
