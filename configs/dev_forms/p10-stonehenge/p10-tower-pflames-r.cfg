[displayconfig]

# work = diagnostics
work = particles

rendering = hub
rotation = -90
fullRotation = True
rotationTrailing = False
checkForConfigChanges = True
doFullReloadOnChange = True
isRPI = False

tileSizeHeight = 16
tileSizeWidth = 32
matrixTiles = 8
rows = 12
cols = 12

## Also determines the window geometry
screenWidth = 128
screenHeight = 140

windowWidth = 128
windowHeight = 140

# preparing for rotation
# if 90 degree rotated, make height same as screen width
canvasWidth = 128
canvasHeight = 140

# for small adjustments when sending to matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset

windowXOffset = 2647
windowYOffset = 102

brightness = 1.0
minBrightness = 0

imageXOffset = 0
imageYOffset = 0

usePixelSort = False
pixelSortRotatesWithImage = True
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 0
pixSortboxHeight = 14
pixSortboxWidth = 132
pixSortgap = 20
pixSortprobDraw = .01
pixSortprobGetNextColor = .01
pixSortProbDecriment = .65
pixSortSizeDecriment = 1.92
pixSortSampleVariance = 10
pixSortDrawVariance = 0
pixSortDirection = medial
randomColorProbabilty = .001
brightnessVarLow = .5
brightnessVarHi = 1.6
pixelSortAppearanceProb = .99

remapImageBlock = False
remapImageBlockSection = 0,0,128,140
remapImageBlockDestination = 0,0
remapImageBlockSectionRotation = 0

remapImageBlock2 = True
remapImageBlockSection2 = 0,16,64,110
remapImageBlockDestination2 = 84,26
remapImageBlockSection2Rotation = 180

remapImageBlock3 = False
remapImageBlockSection3 = 0,0, 384,384
remapImageBlockDestination3 = 0,-320
remapImageBlockSection3Rotation = -90

remapImageBlock4 = False
remapImageBlockSection4 = 0,160, 320,192
remapImageBlockDestination4 = 0,32
remapImageBlockSection4Rotation = 0

useFilters = True
ditherFilterBrightness = 1.0

[testPalette]
particle_fillRange = 270,270,.80,1.0,.5,1.0,100,220
particle_outlineRange = 270,270,.50,1.0,.3,1.0,100,200
# backgroundColor controls
bg_bgTransitions = True
bg_bgRangeA = 10
bg_bgRangeB = 30
bg_tLimitBase = 20
bg_minHue = 180
bg_maxHue = 180
bg_minSaturation = .8
bg_maxSaturation = 1.0
bg_minValue = .1
bg_maxValue = .6
bg_transparencyRange = 10,20

