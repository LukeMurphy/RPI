[displayconfig]
; -----------------------------------------------
# P4mm tower work on 12" construction beam wood
# cut for me by David Mabbot so that the piece is
# 2 degrees off-vertical while the top and base planes
# are horizontal
# August 2024
work = screen_updated
; -----------------------------------------------

checkForConfigChanges = True
doFullReloadOnChange = True

rotation = 0
fullRotation = True
rotationTrailing = False


tileSizeHeight = 32
tileSizeWidth = 64
matrixTiles = 48
rows = 7
cols = 9

screenWidth = 194
screenHeight = 224

# ---  preparing for rotation
windowWidth = 194
windowHeight = 224

canvasWidth = 194
canvasHeight = 224


# daemon7 set up FIRESIDE
canvasOffsetX = 3
canvasOffsetY = 3

# Window Offset
windowXOffset = 2583
windowYOffset = 117

# ----------------------------------------------------------- #

brightness = 1.0
minBrightness = 0

useFilters = True
ditherfilterbrightness = 1.1

# ----------------------------------------------------------- #

# Note the pixels tearing dissipates after 4 levels or blocks
usePixelSort = True
pixelSortRotatesWithImage = False
pixSortDirection = medial
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 126
pixSortYOffset = 3
pixSortboxHeight = 128
pixSortboxWidth = 4
pixSortgap = 1
pixSortprobDraw = .2
pixSortprobGetNextColor = .9
pixSortProbDecriment = 4
pixSortSizeDecriment = 2.0
pixSortSampleVariance = 2
pixSortDrawVariance = 8
randomColorProbabilty = .04
brightnessVarLow = .5
brightnessVarHi = 1.9
pixelSortAppearanceProb = .73

# ----------------------------------------------------------- #

remapImageBlock = False
remapImageBlockSection = 0,0,64,384
remapImageBlockDestination = 0,0
remapImageBlockSectionRotation = 0

remapImageBlock2 = True
remapImageBlockSection2 = 124,0,132,224
remapImageBlockDestination2 = 124,-20
remapImageBlockSection2Rotation = 0

remapImageBlock3 = False
remapImageBlockSection3 = 224,0,256,384
remapImageBlockDestination3 = 0,0
remapImageBlockSection3Rotation = 0

# ----------------------------------------------------------- #

remapImageBlockShift = True
remapImageBlockShiftSection = 128,0,192,224
remapImageBlockShiftStableSection = 0,0,576,256
remapImageBlockShiftDestination = 128,-19

# ----------------------------------------------------------- #

[screenproject]
#-----------------------------------------------#
delay = .03
slotRate = .03


crackColor = 100,100,100,3
outlineColor = 160,200,240,50
bgColor = 180,20,24,5
## Needs to be odd number ...
numCracks = 7
pointsCount = 5
drawCracks = False
origin = 15,4

## Used when first creating the cracks
yVarMin = 6
yVarMax = 36

randomColorSampleProb = .01

probDrawBoxes = .1
probDrawLines = .1
probDrawPerpLines = .1
probDrawVertLines = .991
crackChangeProb = .1
imageResetProb = .001

timeTrigger = True

pauseProb = .001
unpauseProb = .005

## This controls the range of background colors
tLimitBase = 10
minHue = 0
maxHue = 360
minSaturation = .1
maxSaturation = 1
minValue = .99
maxValue = .99
maxBrightness = .99
dropHueMin = 0
dropHueMax = 0

probabilitymultiplierrange = .5

filterremapping = True
filterremappingprob = .1
filterremapminhorisize = 256
filterremapminvertsize = 256
filterremaprangex = 120
filterremaprangey = 120

; pixelsortprobon = .01
; pixelsortproboff = .01

blackOutProb = .0003
blackOutProbOff = .02
blackOutBlock = 256,384
