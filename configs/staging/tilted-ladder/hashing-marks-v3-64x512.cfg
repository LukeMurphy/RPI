[displayconfig]

work = hashing-v3
# work = diagnostics

rotation = 0
fullRotation = True
rotationTrailing = False

checkForConfigChanges = True
doFullReloadOnChange = True

tileSizeHeight = 64
tileSizeWidth = 64
matrixTiles = 48
rows = 2
cols = 20

# ---  Also determines the window geometry
screenWidth = 1200
screenHeight = 256

# ---  preparing for rotation
windowWidth = 1200
windowHeight = 256

canvasWidth = 1200
canvasHeight = 256

# - for small adjustments when sending to
# - matrix panels & cards
canvasOffsetX = 3
canvasOffsetY = 2

# Window Offset

# debug position
; windowXOffset = 283
; windowYOffset = 618

# testing postion
windowXOffset = 2583
windowYOffset = 630

brightness = .9
minBrightness = 0


## This is re-used by the dither filter
## to set the patch affected
remapImageBlock = False		
remapImageBlockSection = 0,0,500,3
remapImageBlockDestination = 0, 0
remapImageBlockSectionRotation = 0

remapImageBlock2 = True
remapImageBlockSection2 = 320,0,640,64
remapImageBlockDestination2 = 0,64
remapImageBlockSection2Rotation = 0

remapImageBlock3 = True
remapImageBlockSection3 = 576,0,896,64
remapImageBlockDestination3 = 0,128
remapImageBlockSection3Rotation = 0

remapImageBlock4 = True
remapImageBlockSection4 = 832,0,1152,64
remapImageBlockDestination4 = 0,192
remapImageBlockSection4Rotation = 0


usePixelSort = False
pixelSortRotatesWithImage = False
pixSortDirection = lateral
unsharpMaskPercent = 30
blurRadius = 0
pixSortXOffset = 0
pixSortYOffset = 0
pixSortboxHeight = 1
pixSortboxWidth = 1200
pixSortgap = 0
pixSortprobDraw = 1.0
pixSortprobGetNextColor = 1
pixSortProbDecriment = 0
pixSortSizeDecriment = 0
pixSortSampleVariance = 3
pixSortDrawVariance = 1
randomColorProbabilty = .01
brightnessVarLow = .9
brightnessVarHi = 1.1
pixelSortAppearanceProb = 1.0

useBlur = False
blurXOffset = 120
blurYOffset = 120
blurSectionWidth = 90
blurSectionHeight = 20
sectionBlurRadius = 2

useFilters = True
ditherfilterbrightness = .9


#---------------------------------#
[hatchingmarks]
#---------------------------------#
# Framerate
redrawSpeed = .03
# amplitude of noise
pointsPerLine = 28
curveResolution = 10

drawingWidth = 1168
drawingHeight = 64

# more loops and tangles
tangleProb = 1.0
backTrackRange = 1,10

# grid single-lines
drawingShape = grid
renderLinesAsEnvelope = True

imageXPOSSpeed = .01

# these really control the feel of
# activity - frenetic grid, soft undulations
# sense of randomness on or through the grid
# @todo make into mode sets

xOffset = 0
pointsPerLineCol = 8
colAdj = 1
colFirst = True
noiseAmplitudeRangeCol = 1.1,3.0
colIntervalRange = 87,107
verticalMovement = True
verticalMovementProb = .2
vertLineChangeRange = .001,.02
vertLineSpeedRange = 1,2
vertBaseWidthRange = 0,0

yOffset = 3
pointsPerLineRow = 428
rowAdj = 1
rowIntervalRange = 7,11
horizontalMovement = True
noiseAmplitudeRangeRow = .1,1.4
horizontalMovementProb = .620
horizLineChangeRange = .001,.002
horizLineSpeedRange = 1,2
horizBaseWidthRange = 0,0

uniformRatio = False
squareRatio = False

useSingleMode = False
# these only need to be set for singleMode
# vertLineChange = 0.5
# horizLineChange = 0.5
# bg_alpha = 10
# line_alpha = 180

# chance per frame the overall drawing character changes
changeLinesProb = .0004
changeBGProb = 0.0002

lightMode = False
lightModeProb = .25
lightLinesOnGroundProb = .0
lightLinesOnGround = False

pauseProb = .0002
unpauseProb = .003

# when going full black/white return to base at this per cycle
bg_alpha_returnrate = .2

# smoothness + speed - higher is smoother
frames = 8
scrollRate = 0


#---------------------  blanks blocks

resetBlanksProb = .0005
numberOfDeadPixels = 3
blankColorAsColorProb = .0
sizeTarget = 1200,64
colsRange = 8,128
rowsRange = 8,128
blankPolyVariation = 2


#--------------------- filterRemapping  ------------------

filterRemapping = True
filterRemappingProb = .005
filterRemappingReappearProb = .1
filterRemapMinHoriSize = 12
filterRemapMaxHoriSize = 256
filterRemapMinVertSize = 8
filterRemapMaxVertSize = 23
filterRemapRangeX = 1000
filterRemapRangeY = 64

contractXSpeed = 40
contractYSpeed = 40
expandXSpeed = 40
expandYSpeed = 40


#---------------------  bgparameters]

; paletteSets = palette_pinks
paletteSets = palette_all_on_naples,palette_aging,palette_pinks

bgBoxColorRanges = 345,10,.50,1.0,.2,1.0,0,0|180,66,.750,1.0,.2,1.0,0,0|34,48,.750,1.0,.62,1.0,0,0
bgBoxAlphaRange = 40,248


drawMoire = True
drawMoireProb = .01
drawMoireProbOff = .08

moireXPos  = 160
moireYPos  = 110
moireXDistance = 10
moireYDistance = 10

setMoireColor = True
moireColor = 0,140,60,50
moireColorAlt = 40,0,0,100
moireColorAltProb = .5

# chance that an overlay block is drawn
usebgBoxProb = .01
clearbgBoxprob = .0003
bgBoxBox = 0,0,256,256

bgTileSizeWidthMin = 64
bgTileSizeHeightMin = 64
bgTileSizeWidthMax = 128
bgTileSizeHeightMax = 129

forcebgBox = True

bgGlitchCyclesMin = 4
bgGlitchCyclesMax = 30
bgGlitchDisplacementHorizontal = 10
