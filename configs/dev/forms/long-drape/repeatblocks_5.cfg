ySpeed = .1

# for the concentric squares
# careful with this, too many over the
# blockWidth will cause an issue....
minnumConcentricBoxes = 2
maxnumConcentricBoxes = 16

# for the randomizer
randomBlockProb = .1
randomBlockWidth = 3
randomBlockHeight = 3

# For the sine wave repeater
steps = 2
amplitude = 9
yOffset = 12

steps2 = 2
amplitude2 = 9
yOffset2 = 13
phaseFactor = 4
speedFactor = 1




